name: D1 · platform badge (Unit A) — fail-first fixture

# ═══════════════════════════════════════════════════════════════════════════
# CONNECTS TO NOTHING BUT A THROWAWAY postgres:17.6 SERVICE CONTAINER.
# HOLDS NO SECRET: the container password below is a literal placeholder.
#
# WHAT IT PROVES (20261102_0102). scripts/db-platform-badge-fixture.mjs plays
# members' sessions the way the client does against the REAL writers
# (record_session_end / backfill_last_seen from 20260920_0001, the F-P1-6
# trigger from 20261029_0002) and requires each of the three causes of the
# blank Admin → Users chip to be RED on its own before 0102, then green after;
# plus PROBE / apply / rollback refusals, on both lane values.
#
# ⚠ NO `${{ ... }}` MAY APPEAR INSIDE ANY `run:` BLOCK — F-47's bright line.
# ═══════════════════════════════════════════════════════════════════════════

on:
  pull_request:
    paths:
      - 'supabase/migrations/20261102_0102_record_session_platform.sql'
      - 'supabase/migrations/PROBE_20261102_0102_record_session_platform.sql'
      - 'supabase/migrations/PROBE_20261102_0100_platform_badge_diagnose.sql'
      - 'supabase/migrations/PROBE_20261102_0101_platform_badge_null_rows.sql'
      - 'supabase/rollback/20261102_0102_record_session_platform_ROLLBACK.sql'
      - 'supabase/migrations/20260920_0001_p1_session_end_and_backfill.sql'
      - 'supabase/migrations/20261029_0002_f_p1_6_ignore_client_presence_write.sql'
      - 'supabase/tests/platform-badge/**'
      - 'scripts/db-platform-badge-fixture.mjs'
      - '.github/workflows/d1-platform-badge-fixture.yml'

permissions:
  contents: read

jobs:
  fixture:
    name: each cause of the blank App/Website chip is red before the fix, green after
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:17.6
        env:
          POSTGRES_PASSWORD: fixture-not-a-secret
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    env:
      PGHOST: 127.0.0.1
      PGPORT: '5432'
      PGUSER: postgres
      PGPASSWORD: fixture-not-a-secret
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install psql
        run: sudo apt-get update -qq && sudo apt-get install -y -qq postgresql-client

      - name: The throwaway server
        run: psql -X -d postgres -tAc 'select version()'

      - name: Fixture — fail-first per cause, apply, PROBE, rollback, re-apply (both lanes)
        run: node scripts/db-platform-badge-fixture.mjs
