name: Android Build

# 50mm Retina World — Android build with OPTIONAL auto-signing + auto-upload.
# ---------------------------------------------------------------------------
# This is a drop-in upgrade of your existing .github/workflows/android-build.yml.
# It is SAFE to add as-is: with NO secrets set it behaves EXACTLY like today
# (builds an unsigned .aab). It "levels up" automatically as you add secrets:
#
#   • Add ANDROID_KEYSTORE_BASE64 + ANDROID_KEYSTORE_PASSWORD + ANDROID_KEY_ALIAS
#     + ANDROID_KEY_PASSWORD  →  every build comes out SIGNED and upload-ready.
#   • Also add PLAY_SERVICE_ACCOUNT_JSON  →  every build is auto-uploaded to the
#     Play Console "Internal testing" track as a DRAFT (you just review + roll out).
#
# Secrets go in GitHub → Settings → Secrets and variables → Actions. The person
# who has the upload keystore adds them ONCE; nobody else ever needs to see them.
# See ANDROID_AUTORELEASE_SETUP.md for the 10-minute one-time setup.

# ═══════════════════════════════════════════════════════════════════════════
# 2026-09-01 — v1.2.18. THE ONE PLAY WARNING ON 1115, CLOSED.
#
# Build 1115 (v1.2.17) succeeded, was signed, and uploaded to the Play Console
# — with exactly one warning:
#
#     This App Bundle contains native code, and you've not uploaded debug
#     symbols. We recommend you upload a symbol file to make your crashes and
#     ANRs easier to analyze and debug.
#
# THE BUILD HAD ALREADY ASKED FOR SYMBOLS. `ndk { debugSymbolLevel ... }` has
# been set in the R8 step for weeks. NOTHING EVER READ THE RESULT, so a setting
# that silently did nothing was indistinguishable from one that worked — the
# same shape as F-53, as the moved marker, and as every other defect in this
# repository's history: the intent was right and the artefact was never read.
#
# Two changes:
#   1. debugSymbolLevel SYMBOL_TABLE -> FULL.
#   2. A new BLOCKING step after the bundle is built: it lists the native
#      libraries, lists the symbol entries, and REFUSES to ship a bundle that
#      has native code without symbols. Tested three ways before it shipped —
#      symbols present -> pass; native libs with no symbols -> FAIL; no native
#      libs -> pass. Play can never again be the thing that discovers this.
#
# ═══════════════════════════════════════════════════════════════════════════
# 2026-08-31 — v1.2.17 RE-CUT (run #114 produced no artifact, so the name is
# NOT spent — same handling as builds 1105, 1107 and 1109 below).
#
# Run #114 was refused by this workflow's own feature gate:
#
#     MISSING from bundle: Edit-caret fix (2026-08-12) (marker 'caretPlaced').
#
# NOTHING WAS WRONG WITH THE APP. The marker string moved when the promotion
# replaced AdComments.tsx's hand-rolled comment row with the shared
# CommentThread; the gate keys on spelling and cannot tell a re-write from a
# deletion. The feature is proven present by reading the code, not asserted:
# AdComments renders CommentThread, CommentThread renders <MentionInput
# autoFocus/> when editing, MentionInput places the caret at the end. The
# marker now lives beside that call, as a `dataset` key — minification renames
# locals but never a dataset property, so the string reaches the artefact the
# gate actually reads. Verified by building and running the gate's own six
# greps against dist/assets/*.js: all six OK.
#
# ALSO IN THIS RE-CUT: the WebP step can no longer fail the release. See the
# note on it below — it is the same apt call that killed 1107 and 1109.
#
# ═══════════════════════════════════════════════════════════════════════════
# 2026-08-31 — v1.2.17. THE FIRST ANDROID BUILD SINCE THE CHANNEL WAS BROKEN.
#
# ⚠ READ THIS BEFORE ASSUMING THE APP CHANNEL WAS FINE. Run #113, on the
# promotion commit 789d455, FAILED — and produced no .aab:
#
#   vite.config.ts(6,30): Could not find a declaration file for module
#   './scripts/lane-config.mjs' ... implicitly has an 'any' type.
#
# That is F-52. `npx tsc -b tsconfig.json` (tsconfig.node.json, "strict": true)
# is run by THIS WORKFLOW AND NOWHERE ELSE — `npm run typecheck` uses
# tsconfig.app.json, which sets "noImplicitAny": false and passes. And this
# workflow fires only on push to main for two paths, never on a pull request.
# So the error could not be seen before it was merged, and the Android release
# channel sat dead while every check on the repository was green.
#
# scripts/lane-config.d.mts (b6a22c1) fixes it and reached main today in
# 86a17dd1. The gate gap itself is NOT fixed: nothing runs the strict
# typecheck on a pull request. That stays on the record as F-52.
#
# WHAT THIS BUILD CARRIES, beyond everything in 1111:
#
#  1. F-53 — the app bundles its web assets (capacitor webDir: dist, no
#     server.url), so index.html ships INSIDE the apk/aab. Until today that
#     index.html carried the literal text %VITE_SITE_ORIGIN%, unsubstituted,
#     because Vite's HTML token replacement has no default and Cloudflare
#     Pages' production environment defines no VITE_SITE_ORIGIN. Substitution
#     now runs through scripts/lane-config.mjs's defaulting rule, and
#     scripts/verify-html-tokens.mjs fails any build whose emitted HTML still
#     carries an unsubstituted token — so this class of defect can no longer
#     be packaged into a phone build unnoticed.
#
#  2. The @mention list no longer leaves the screen. Measured at 360px, the
#     width the app actually runs at: the list ran to 369.3px on a 360px
#     screen and the send button painted over its corner. react-mentions
#     already guards its right edge but measures the suggestions OVERLAY, and
#     all sizing had been written on the inner <ul> with position:absolute —
#     out of flow, so the overlay reported 100px while 277px was painted.
#     Sizing moved onto the overlay; zIndex 50; forceSuggestionsAboveCursor.
#
# GATES ON THE CODE IN THIS BUILD: vitest 2,480 passed / 0 failed; tsc app and
# strict both clean; full uishot sweep 152 screenshots, 0 problems, baseline
# diff clean; tools/uishot/mention-overflow.mjs 4/4 on screen and 3/4 failing
# on the pre-fix code. Verified live on www.50mmretina.com after deploy.
#
# versionName 1.2.17 because 1.2.16 is spent — build 1111 carried it. Two
# different builds under one version string is exactly what the note below
# says never to do.
#
# ACCEPTANCE IS NOT "IT BUILT": the owner installs it and types "@" in a
# comment on a phone. The name list must be fully on screen and in front of
# the send button.
#
# ═══════════════════════════════════════════════════════════════════════════
# BUILD 1102 / v1.2.11 — THE FIRST BUILD CUT FOR A PUBLIC RELEASE
#
# Owner: "Final build give me after checking as it will in Public."
# Owner: "build name give 1102."  -> cut, promoted, live.
#
# 2026-08-20 — BUILD 1111 / v1.2.16. THE APP STOPS GROWING THE MEDIA DELTA.
#
# WHY THIS BUILD EXISTS. At 18:16 UTC today a member published a photograph
# from the app and it landed image_urls-only with NO media_objects, NO
# post_media and NO MEDIA-4xxx log line — because the app bundles its web
# assets at build time (capacitor webDir: dist, no server.url), and every
# build up to and including 1110 was cut BEFORE the write path shipped to
# main (2026-08-20 15:51 UTC, PR #81). The web channel was proven fixed the
# same day; the app channel kept publishing through the legacy insert,
# invisibly. media_write_path_delta() flipped delta_growing=TRUE on exactly
# that post, which is the alarm doing its job.
#
# WHAT THIS BUILD CARRIES: today's dist, i.e. the in-call-position supabase.rpc
# fix at both write sites (RED-1), the classified fallback (MEDIA-4009/4010,
# D-005), the scheduled-duplicate fix (RED-2, D-006 era), __APP_BUILD
# 2026-08-20-2. No native change; versionName 1.2.16, versionCode 1000+run.
#
# ACCEPTANCE IS BEHAVIOURAL, NOT "IT BUILT": after rollout, ONE real app post
# must show post_media + media_objects rows and delta_growing must return to
# FALSE. Until that is observed, Phase 2 stays at 96%.
#
# 2026-08-19 — BUILD 1110 / v1.2.15. RE-CUT AGAIN. 1109 hung on apt in exactly
# the same place as 1107, because the retry added after 1107 could not help:
# apt does not fail fast, so attempt one outlived the job budget. `--with-deps`
# is now gone entirely — the browser comes from Playwright's CDN and no system
# package manager is touched. Neither run produced an artifact, so versionName
# is still 1.2.15.
#
# 2026-08-19 — BUILD 1109 / v1.2.15. RE-CUT. Build 1107 was CANCELLED at the
# 30-minute timeout with the UI gate stuck installing Chromium: apt could not
# reach Ubuntu's mirror. Nothing was wrong with the app, the sweep or the gate,
# and 1107 produced no artifact — so versionName stays 1.2.15, exactly as 1105
# and 1106 were handled below. The install step is now cached and retried three
# times, because a gate that blocks a release must not fail on somebody else's
# package mirror.
#
# 2026-08-19 — BUILD 1107 / v1.2.15. THE FIRST BUILD CUT THROUGH THE UI GATE.
#
# Owner, after the registration date-of-birth dropdowns shipped unusable on BOTH
# web and app: "we will build one gate you will break another gate which is
# working. This should not happen" and "I need permanenet solution for this.
# then fix bug - not shorcut cheap soltuion anymore".
#
# So the gate was built FIRST and the fixes went through it.
#
#  1. THE DOB DROPDOWNS ARE TAPPABLE AGAIN. Not a missing dropdown — an
#     INTERCEPTED one. Both selects rendered at the correct size, in the DOM,
#     plainly visible, and swallowed every tap: calendar.tsx's `nav` is
#     `absolute inset-x-0 top-0 z-10`, a full-width bar over the caption row
#     where the dropdowns live. Proved by hit test, not argued from the code —
#     elementFromPoint() at the centre of the month select (12 options) and the
#     year select (69) returned the NAV element, at all four viewports. Fixed
#     with pointer-events-none on the bar and pointer-events-auto on each arrow,
#     mutation-proven both ways.
#
#  2. THE PRIVACY CHOOSER IS BACK — WITH ITS LIMIT STATED IN THE UI. Reversing
#     item 1 of the 1103 notes below, by the owner's decision (D-002). The gap
#     those notes describe is UNCHANGED and still verified: post-images is a
#     public bucket whose SELECT policy carries no privacy condition, so a
#     "Friends" or "Only me" photo stays fetchable by anyone holding its link.
#     Told that plainly — including that hiding the link in the app fixes
#     nothing — the owner chose to offer the control and say so, rather than
#     keep members waiting. PostAudienceChooser renders the disclosure itself,
#     so the two cannot be separated. docs/DECISIONS.md carries the reasoning
#     and the condition that ends it.
#
#  3. THE CATEGORY STRIP no longer hides chips under the "All categories"
#     button on a phone. Measured at 390: the chip showed 43x62 and a tap at
#     the centre of what was visible opened All categories instead of filtering.
#
#  THE GATE ITSELF, which is the point of this release:
#     • every interactive control on every scene and viewport must be the
#       element actually painted at its own centre;
#     • every control's size, reachability and option count is diffed against a
#       recorded baseline, so a control that disappears, shrinks below the tap
#       floor or loses its options fails the build EVEN ON A SCREEN THE CHANGE
#       NEVER TOUCHED;
#     • `build-aab` carries `needs: [security-gate, ui-gate]`, and the wiring is
#       asserted by uiGateCannotBeBypassed.test.ts, mutation-proven 17/17.
#
#  Build #107 already demonstrated the block on a real release attempt: the gate
#  went red and build-aab was SKIPPED — 0s, no artifact.
#
#  IT FOUND TWO DEFECTS NOBODY WAS LOOKING FOR, in code restored verbatim from
#  history, because the audience chooser had NEVER been photographed: a 22px
#  tall pill (10px under the tap floor) and a GLOBE icon beside the words
#  "Only Me".
#
# GATES: typecheck 0 · 1,999 tests · 148 scene/viewport keys, 2,569 controls,
#        ZERO problems · three mutation harnesses green (17/17, 10/10, 10/10).
#
# STILL OPEN AND NOT CLAIMED: authorized media delivery (B5) — built, not
# deployed, and the reason D-002 exists. The journal / featured-artist PDF
# cause. NO REELS. NO LIVE.
#
# 2026-08-17 — BUILD 1106 / v1.2.14. Re-cut. Build 1105 carried the same code
# but was REFUSED by CI, correctly: securityDefinerGrants and deletionCoverage
# found three defects in the hashtag migration applied that morning —
# recount_hashtags and suggest_hashtags reachable by anon, and post_hashtags
# missing its cascade from auth.users. They had been invisible because that
# migration's filename did not match the 14-digit pattern both gates select on.
# Fixed in production as migration 20260817102540 and verified there. The gate
# was not touched. versionName stays 1.2.14 — 1105 produced no artifact.
#
# 2026-08-17 — BUILD 1105 / v1.2.14. PRODUCTION BLOCKER: MEMBERS COULD NOT
# PUBLISH. A resumed draft failed on Share with "Cannot read properties of
# undefined (reading 'rest')" because one line copied supabase.rpc into a
# variable, detaching it from its client. Proven by a runtime test that builds
# a real supabase-js client and was mutation-tested both ways. The same toast
# also showed a raw JavaScript exception with no error code; it now shows a
# sentence and DRAFT-2002.
#
# 2026-08-17 — BUILD 1104 / v1.2.13. THREE CORRECTIONS THE OWNER ASKED FOR:
#   1. Crop & Upload no longer dismisses the composer, so the tag/category
#      step opens instead of everything vanishing. Reproduced, traced to a
#      Radix outside-dismiss, fixed, and MUTATION-TESTED both ways with
#      tools/uishot/repro-crop-upload.mjs.
#   2. The inline caption editor's Cancel and Save are 44px again.
#   3. The app's caption box shares the composer's ref, so @mentions can
#      appear there for the first time.
#
# 2026-08-17 — BUILD 1103 / v1.2.12. THE HASHTAG TYPEAHEAD.
# Owner: "tHIS SYSTEM I WANT ONLY OST SECTION ITSELF", "Post Section Only",
# "Feed and My Wall", "YEs on inline edit and scheduled posts too".
#
# The database half is ALREADY LIVE — it was applied and verified before this
# build was cut, so the website has had the feature since then. This build is
# what carries it to the phone, because the app bundles the site rather than
# loading it (no server.url in capacitor.config).
#
# versionCode is 1000 + the run number, so 1103 requires that EXACTLY ONE more
# workflow run fires. Only two paths trigger this workflow — this file and
# ANDROID_BUILD_TRIGGER. Every code change for this release was therefore pushed
# first, touching neither, and this single edit is the one and only trigger.
# ANDROID_BUILD_TRIGGER is deliberately left alone for the same reason; these
# notes live here instead so the release still explains itself.
#
# WHAT CHANGED SINCE 1102's PREDECESSOR (1101 / v1.2.10)
#
#  1. THE PRIVACY CHOOSER IS WITHHELD. Checked against production rather than
#     read from a plan: `select privacy, count(*) from posts` -> public: 218,
#     and nothing else. The database, the feed and eight of nine surfaces honour
#     a post's privacy; the DIRECT IMAGE URL does not, because authorized media
#     delivery (B5) is unfinished. Harmless today only because nothing private
#     exists — and a public release is precisely what would end that. The first
#     member to choose "Private" would be given a promise the platform cannot
#     keep. So the control is withheld and every post is public, which all 218
#     already are.
#
#     Writing the test for it found a SECOND chooser — on composer screen 2,
#     the only one an Android member ever reaches. Without that test this build
#     would have withheld the control on the website while shipping it live to
#     every phone.
#
#  2. ONE UPLOADER, FROM ANY PAGE. "as top menu icon is fix it should be from
#     single uploader while standing on any page." The composer is mounted once
#     in the shell; the Create button raises a flag on the CURRENT url and
#     nothing navigates. Measured in app mode at 412px, from the wall AND from
#     the feed: picker fires, PAGE UNCHANGED, exactly one composer mounted.
#     The page staying put is the difference — before, it moved to the feed, and
#     that navigation racing Android's picker was the bug.
#
#     The previous attempt at this was measured to change nothing and is
#     recorded as such in the source. This one is measured to change the thing
#     that matters.
#
#  3. Everything in 1.2.10 stands: the crop dialog's `pointer-events-auto`,
#     verified on the live site.
#
# GATES: typecheck 0 · 1,868 tests · production build 0 · 124 screenshots,
#        ZERO layout problems, zero non-fixture errors.
#
# STILL OPEN AND NOT CLAIMED: the journal / featured-artist PDF cause — it now
# reports its real reason instead of "failed", and that reason is needed from a
# device. Certificates, Wallet and Admin transactions ARE fixed.
#
# NO REELS. NO LIVE.
# ═══════════════════════════════════════════════════════════════════════════

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/android-build.yml"
      - "ANDROID_BUILD_TRIGGER"

jobs:
  # ---------------------------------------------------------------------------
  # P11 — NOTHING IS BUILT UNTIL THIS PASSES.
  #
  # Owner requirement: an Android build must not be produced, signed, or uploaded
  # to Play while this project's own security rules are failing. `build-aab`
  # below carries `needs: security-gate`, so a red gate means the build job never
  # starts — no .aab exists to upload by accident.
  #
  # WHY THIS RUNS `scripts/security-audit.mjs` AND NOTHING ELSE:
  #   * It uses only Node built-ins, so a broken or unfetchable dependency cannot
  #     stop it running — which is exactly when a security gate matters most.
  #   * It is the ratchet that was tuned by hand until it stopped crying wolf:
  #     the first run reported 14 blocking findings and the real number was 3.
  #     A gate that is red every day is a gate nobody reads.
  #   * Secrets-over-full-history and the production dependency audit already run
  #     on EVERY push to main in `security.yml`. Repeating them here would add
  #     minutes to every build and gate the phone release on a threshold that is
  #     still being ratcheted down.
  #
  # It fails on CRITICAL or HIGH only. Measured 2026-08-10 on this commit:
  # CRITICAL 0 · HIGH 0 · MEDIUM 2 · LOW 2 — PASS.
  # ---------------------------------------------------------------------------
  security-gate:
    name: Security gate (blocks the build)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: This project's own security rules
        run: node scripts/security-audit.mjs

  # ---------------------------------------------------------------------------
  # THE UI GATE — NOTHING IS BUILT UNTIL EVERY CONTROL IS REACHABLE.
  #
  # Owner requirement, 2026-08-19, after the registration date-of-birth
  # dropdowns shipped unusable on BOTH web and app:
  #   "we will build one gate you will break another gate which is working.
  #    This should not happen"
  #
  # He is describing a class of failure, not one bug, and the class is: a change
  # in one place silently breaks a control somewhere nobody thought to look. The
  # 1,982 unit tests could not catch it — only ~15 of them render anything at
  # all, and a test asserting a function returns the right value has nothing to
  # say about a nav bar painted on top of a <select>.
  #
  # So this job renders every scene at every viewport in real Chromium and
  # blocks the build on two things a screenshot alone cannot tell you:
  #
  #   GATE 1  every interactive control must be the element actually painted at
  #           its own centre — the exact fault above, hit-tested rather than
  #           argued about.
  #   GATE 2  every control's size, reachability and option count is diffed
  #           against tools/uishot/baseline.json, so a control that disappears,
  #           shrinks below the tap floor, or quietly loses its options fails
  #           the build EVEN ON A SCREEN THIS CHANGE NEVER TOUCHED. That is the
  #           part that answers the owner's objection: it does not depend on
  #           anyone having predicted the failure.
  #
  # `build-aab` carries `needs: [security-gate, ui-gate]`, so a red gate means
  # the build job never starts and no .aab exists to upload by accident — the
  # same shape as the security gate above.
  #
  # ⚠ THE BASELINE IS DELIBERATE, NOT AUTOMATIC. This job never writes it.
  # `--baseline-write` is a reviewed act, like an approved migration hash: a run
  # that silently re-recorded its own baseline would agree with itself for ever.
  #
  # Determinism was proven before this was wired in, because a gate that fails
  # at random is a gate people learn to re-run rather than read: the first
  # baseline caught a back-to-top button mid-animation at 35x35 (44 x 0.8) and
  # the next run reported it "gone". Controls mid-transition are now neither
  # judged nor recorded, and two consecutive independent sweeps then came back
  # clean against the same baseline.
  # ---------------------------------------------------------------------------
  ui-gate:
    name: UI gate — reachability + baseline (blocks the build)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        # `npm ci`, never `npm install`, and no fallback — same reasoning as the
        # build job below: a failed install must fail, not silently re-resolve.
        run: npm ci --no-audit --no-fund

      # The container this was developed in ships a pinned Chromium and
      # capture.mjs resolves it from PLAYWRIGHT_BROWSERS_PATH. A GitHub runner
      # has neither, so the browser is installed here and capture.mjs falls back
      # to Playwright's own default — one code path, two environments.
      # ⚠ RETRIED, AND CACHED, BECAUSE THIS STEP BLOCKS A RELEASE.
      #
      # Build 1107 was CANCELLED at the 30-minute timeout with the gate stuck
      # here: `npx playwright install --with-deps chromium` runs apt, and
      # Ubuntu's mirror was refusing — the log is pages of
      # `Ign: http://azure.archive.ubuntu.com ... InRelease`. Nothing was wrong
      # with the app, the sweep or the gate. The same step had taken 5 minutes
      # an hour earlier.
      #
      # A gate that blocks the build must not fail on somebody else's package
      # mirror. That is how a checker earns a reputation for crying wolf, and
      # this one is load-bearing.
      #
      # The cache removes the download entirely on a repeat run. The retry
      # covers a cold cache landing on a bad mirror. It STILL FAILS after three
      # attempts — this makes the step resilient, not permissive, and a genuine
      # inability to install Chromium remains a red gate and no .aab.
      - name: Cache the Playwright browser
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-chromium-${{ hashFiles('package-lock.json') }}

      # ⚠ NO `--with-deps`, AND THAT IS THE FIX. `--with-deps` runs apt, and apt
      # is what hung TWICE — builds 1107 and 1109 both sat on
      # `Ign: http://azure.archive.ubuntu.com ... InRelease` until the job
      # timed out. The retry added after the first failure did not help,
      # because apt does not fail fast: it retries internally for longer than
      # the whole job budget, so a three-attempt loop never reached attempt two.
      #
      # This downloads the browser binary from Playwright's own CDN and touches
      # no system package manager at all. GitHub's ubuntu runner image already
      # ships the shared libraries Chromium needs — it pre-installs Chrome,
      # Edge and Firefox — so the deps `--with-deps` would have fetched are
      # already present.
      #
      # ⚠ AND IF THEY ARE NOT, THIS STILL FAILS HONESTLY: Chromium will not
      # launch, the sweep cannot render a single scene, and the gate goes red
      # with no .aab. Nothing here is permitted to pass by assuming.
      - name: Install Chromium for Playwright
        run: |
          set -uo pipefail
          for attempt in 1 2 3; do
            if npx playwright install chromium; then
              echo "Chromium ready (attempt ${attempt})."
              exit 0
            fi
            echo "::warning::Chromium download attempt ${attempt} failed; retrying."
            sleep $((attempt * 15))
          done
          echo "::error::Chromium could not be downloaded after 3 attempts."
          exit 1

      # ⚠ ONE COMMAND, THE SAME ONE A PERSON RUNS LOCALLY. The sweep needs a dev
      # server and capture.mjs deliberately does not start one, so the joining
      # lives in tools/uishot/gate.mjs rather than being improvised differently
      # here and on a laptop. A gate invoked two ways has two behaviours.
      # Synthetic backend env for the sweep — .env is no longer committed, the dev
      # server needs VITE_* defined, and the fixture-driven sweep must never touch
      # a real backend. Same values as vitest.config.ts and ui-gate.yml.
      - name: Every control reachable, nothing regressed against the baseline
        env:
          VITE_SUPABASE_URL: https://testprojectref0000x.supabase.co
          VITE_SUPABASE_PUBLISHABLE_KEY: test-publishable-key-not-real
          VITE_SUPABASE_PROJECT_ID: testprojectref0000x
        run: npm run ui:gate

      # The screenshots are the evidence. On a failure they are the difference
      # between "the gate went red" and knowing what it saw.
      - name: Upload the screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ui-sweep-screenshots
          path: /tmp/shots
          retention-days: 7
          if-no-files-found: warn

  build-aab:
    needs: [security-gate, ui-gate]
    runs-on: ubuntu-latest
    timeout-minutes: 45
    # This job consumes the signing and Play secrets, and what it produces is
    # installed on members' phones — it is a production job by definition.
    #
    # ⚠ THE DECLARATION IS AHEAD OF THE MOVE, DELIBERATELY. The five Android/Play
    # secrets are still repository-level today, so they resolve with or without
    # this line and nothing changes yet. The moment they are moved into the
    # production Environment, this is what keeps the job working — and what stops
    # any other job reaching them. Declaring it first means the move is a
    # one-step change with no window where the build is broken.
    environment: production
    env:
      PLAY_SA: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON }}
    steps:
      - uses: actions/checkout@v4

      # ⚠ NODE 22, NOT 20 — @capacitor/cli 8.5.0 hard-requires it.
      #
      # Build 0988b65 failed at `npx cap add android` with, verbatim:
      #     [fatal] The Capacitor CLI requires NodeJS >=22.0.0
      #
      # ⚠ READ THIS BEFORE CONCLUDING THE PIN CAUSED IT. IT DID NOT — IT
      # REVEALED IT. The install below was previously unpinned, so it always
      # took the newest @capacitor/cli, which IS the 8.5.0 the pin now names.
      # This build would have failed identically with no pin at all. The only
      # thing the pin changed is that the failure is now attached to a version
      # number written down in this file rather than to what day it is.
      #
      # That is the whole argument for pinning, demonstrated one build after it
      # was introduced: a floating dependency raised its own Node floor and
      # broke the Android build of a live app with no code change behind it.
      #
      # Vite 7 accepts ^20.19.0 || >=22.12.0 and vitest accepts >=22, so 22 is
      # safe for the typecheck, test and web-build steps that run on it too.
      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Install web dependencies
        # ⚠ NO `|| npm install` FALLBACK. Any npm ci failure — lock/manifest
        # desync, a registry 5xx, an integrity mismatch — used to degrade
        # silently to range re-resolution across 88 caret-ranged deps, with a
        # green step and nothing asserting which path ran. A failed install must
        # fail the build.
        run: npm ci --no-audit --no-fund

      # -------------------------------------------------------------------
      # NO ERRORS ARE CARRIED INTO THE BUILD.
      #
      # Owner, 2026-08-12: *"App needs to be perfect, no errors needs to be
      # carried out on the build"*.
      #
      # Until now this job compiled an APK without ever running the type
      # checker or a single one of the 1,299 tests — only `security-audit.mjs`
      # gated it. A component could be broken, or deleted, or (as happened
      # twice in Stage C) imported by nothing at all, and the build would still
      # come out green and installable.
      #
      # These two steps are the gate. They run BEFORE `npx cap add android`, so
      # a failure costs seconds instead of a 20-minute Gradle run, and no
      # artifact is produced at all.
      # -------------------------------------------------------------------
      - name: Typecheck (blocks the build)
        # ⚠ `-p tsconfig.json` compiled ZERO files. tsconfig.json is a solution
        # file (`files: []` + `references`), and without `-b` tsc ignores the
        # references entirely and exits 0 having checked nothing. Proved with
        # `--listFiles`: 0 lines. It had been hiding two real errors.
        run: npx tsc -b tsconfig.json

      - name: Test suite (blocks the build)
        run: npm test

      # ⚠ EVERY VERSION IS PINNED. THE BUILD MUST NOT DEPEND ON WHAT DAY IT IS.
      #
      # This step used to install these eleven packages with NO version at all:
      #
      #     npm install @capacitor/core @capacitor/cli @capacitor/android …
      #
      # Because `android/` is generated fresh by `npx cap add android` below and
      # is never committed, that made the ENTIRE native layer of this app float.
      # Whatever npm happened to publish that morning went into the AAB, with no
      # pull request, no diff and nobody's review. A Capacitor major release
      # would have landed in a Play production build silently, and the first
      # signal would have been crash reports.
      #
      # Two builds of the same commit could differ. That is the definition of a
      # non-reproducible build, and it was the single largest uncontrolled risk
      # in this repository.
      #
      # These exact versions are the ones CI was already resolving on
      # 2026-08-13, so pinning them changes NOTHING about today's output — it
      # only stops tomorrow from being different. Verified as a mutually
      # compatible set with `npm install --strict-peer-deps` (clean, 0 peer
      # conflicts) before being written down.
      #
      # ⚠ WHY NOT package.json + package-lock.json, which would be tidier:
      # adding them there requires regenerating the lockfile, and doing that
      # against this repo's caret ranges pulled in 414 new packages, removed 122
      # and changed 193 — a mass upgrade of the whole dependency tree of a LIVE
      # site, riding along with a Capacitor pin. That deserves its own change,
      # its own review and its own build. Pinning here buys the determinism
      # today for a four-line diff and touches nothing the website ships.
      #
      # TO UPGRADE: change a number here, in a pull request, and read the build.
      # That is the whole point — an upgrade should be a decision, not a date.
      - name: Install Capacitor + native plugins (pinned)
        run: |
          npm install --no-audit --no-fund \
            @capacitor/core@8.5.0 @capacitor/cli@8.5.0 @capacitor/android@8.5.0 \
            @capacitor/share@8.0.1 @capacitor/splash-screen@8.0.2 \
            @capacitor/filesystem@8.1.2 @capacitor/camera@8.2.2 \
            @capacitor/app@8.1.1 @capacitor/browser@8.0.4 \
            @capacitor-firebase/messaging@8.4.0 \
            @capawesome/capacitor-app-update@8.0.3

      # Proves the pin actually took. `npm install` can silently resolve
      # something else when a transitive peer forces its hand, and a pin that
      # did not apply is worse than no pin: it reads as deterministic while
      # floating. Fails the build rather than shipping a surprise.
      - name: Prove the pinned Capacitor versions are what got installed
        run: |
          set -e
          check() {
            actual=$(node -p "require('./node_modules/$1/package.json').version")
            if [ "$actual" != "$2" ]; then
              echo "::error::$1 resolved to $actual but this workflow pins $2"
              exit 1
            fi
            echo "  ok  $1@$actual"
          }
          echo "Verifying pinned native dependency versions:"
          check @capacitor/core 8.5.0
          check @capacitor/cli 8.5.0
          check @capacitor/android 8.5.0
          check @capacitor/share 8.0.1
          check @capacitor/splash-screen 8.0.2
          check @capacitor/filesystem 8.1.2
          check @capacitor/camera 8.2.2
          check @capacitor/app 8.1.1
          check @capacitor/browser 8.0.4
          check @capacitor-firebase/messaging 8.4.0
          check @capawesome/capacitor-app-update 8.0.3
          echo "All native dependencies match the pin."

      # This dist ships inside the APK, so it is built against PRODUCTION —
      # explicitly, now that .env is no longer committed (isolation guard,
      # 2026-08-21). Public values, the same ones in every browser bundle.
      - name: Build web app
        env:
          VITE_SUPABASE_URL: https://jtdtehuqtinjxropkkcn.supabase.co
          VITE_SUPABASE_PUBLISHABLE_KEY: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Imp0ZHRlaHVxdGluanhyb3Bra2NuIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODM1NzI3MjEsImV4cCI6MjA5OTE0ODcyMX0.qY8BI5LXb6uLzTwbpf8AleZ6UZyfeaOA0q4_TC5CEpo
          VITE_SUPABASE_PROJECT_ID: jtdtehuqtinjxropkkcn
