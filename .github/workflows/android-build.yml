      - name: Add Android platform
        run: npx cap add android

      # `npm install @capacitor/camera` succeeding proves only that npm found a
      # tarball. What matters is that `cap add android` DETECTED it and wired it
      # into the Gradle build — if it did not, `window.Capacitor.Plugins.Camera`
      # is undefined at runtime and the in-app photo picker silently falls back
      # to the WebView file input. That is exactly the failure that shipped in
      # every APK before build #75, unnoticed, because nothing asserted it.
      - name: Prove the Camera plugin is wired into the native project
        run: |
          set -euo pipefail
          echo "--- capacitor.settings.gradle ---"
          cat android/capacitor.settings.gradle
          echo "--- app/capacitor.build.gradle ---"
          cat android/app/capacitor.build.gradle
          grep -q "capacitor-camera" android/capacitor.settings.gradle
          grep -q "capacitor-camera" android/app/capacitor.build.gradle
          echo "OK: capacitor-camera is in both Gradle files"

      - name: Enable edge-to-edge (clears both Play user-experience recommendations)
        run: |
          # The template opts OUT of edge-to-edge via the deprecated
          # windowOptOutEdgeToEdgeEnforcement attribute - exactly what Play
          # flags as "may not display for all users" + "deprecated APIs or
          # parameters". Flip every occurrence off; the WebView insets are
          # handled by adjustMarginsForEdgeToEdge in capacitor.config.ts.
          grep -rl "windowOptOutEdgeToEdgeEnforcement" android/app/src/main/res/ | while read f; do
            sed -i 's/\(windowOptOutEdgeToEdgeEnforcement">\)true/\1false/' "$f"
            echo "patched: $f"
          done || echo "no opt-out flag found (template already clean)"
          grep -rn "windowOptOutEdgeToEdgeEnforcement" android/app/src/main/res/ || true

      - name: Configure Android SDK and AGP versions
        run: |
          sed -i 's/minSdkVersion = 23/minSdkVersion = 24/' android/variables.gradle
          sed -i 's/compileSdkVersion = 35/compileSdkVersion = 36/' android/variables.gradle
          # Target API 36 (Android 16) — required by Google Play from 31 Aug 2026.
          sed -i -E 's/targetSdkVersion = [0-9]+/targetSdkVersion = 36/' android/variables.gradle
          # AGP 8.12+ is REQUIRED for optimized resource shrinking (Play
          # "R8 optimization" recommendation). AGP 8.12 needs Gradle >= 8.13,
          # so the wrapper is bumped in lockstep - see Android's AGP/Gradle
          # compatibility table.
          # AGP 8.12.3 + Gradle 8.13 — the configuration that built 1028
          # successfully and cleared 3 of Play's 4 recommendations.
          sed -i -E 's/(com\.android\.tools\.build:gradle:)[0-9.]+/\18.12.3/' android/build.gradle
          sed -i -E 's#(distributionUrl=.*gradle-)[0-9.]+(-(bin|all)\.zip)#\18.13\2#' android/gradle/wrapper/gradle-wrapper.properties
          echo "--- AGP / Gradle ---"
          grep -n "com.android.tools.build:gradle" android/build.gradle
          grep -n "distributionUrl" android/gradle/wrapper/gradle-wrapper.properties
          # Optimized resource shrinking (AGP >= 8.12). Default from AGP 9.
          printf '\nandroid.r8.optimizedResourceShrinking=true\n' >> android/gradle.properties
          echo "--- gradle.properties tail ---"
          tail -5 android/gradle.properties

      - name: Set app version (monotonic versionCode from run number)
        run: |
          VC=$(( 1000 + ${{ github.run_number }} ))
          sed -i "s/versionCode 1/versionCode ${VC}/" android/app/build.gradle
          # ⚠ MUST DIFFER FROM WHAT IS LIVE. Play production is on 1073 (1.2.2)
          # as of 2026-08-12. Shipping a second release also called "1.2.2"
          # makes the Console, the crash reports and the user's About screen
          # ambiguous — two different builds wearing one name. Bump it every
          # time the store gets a new build.
          # 2026-08-14: bumped 1.2.3 -> 1.2.4. Build 1082 was cut as 1.2.3; I do
          # not know whether the owner promoted it to the store. Bumping is
          # correct either way — if 1.2.3 never shipped we simply skip a name,
          # and if it did, reusing it would put two different builds under one
          # version string. Skipping a name costs nothing; reusing one costs
          # clarity in the Console, in crash reports and on the About screen.
          # 2026-08-17: bumped 1.2.13 -> 1.2.14 for the publishing blocker fix.
          # 2026-08-17: bumped 1.2.12 -> 1.2.13. Build 1103 was cut as 1.2.12;
          # whether it was promoted or not, bumping is correct — skipping a
          # name costs nothing, reusing one costs clarity in the Console, in
          # crash reports and on the member's About screen.
          # 2026-08-20: bumped 1.2.15 -> 1.2.16. Build 1110 was cut as 1.2.15
          # and uploaded to the Play production track as a draft; whether the
          # owner rolled it out or not, the name is spent. 1.2.16 carries the
          # media write-path fix (RED-1) — the reason this build exists.
          # 2026-08-31: bumped 1.2.16 -> 1.2.17. Build 1111 was cut as 1.2.16.
          # 1.2.17 carries F-53 (the unsubstituted %VITE_SITE_ORIGIN% that the
          # app bundles into its own index.html) and the @mention list fix —
          # and it is the first build since run #113 failed on F-52, leaving
          # the Android channel dead with every other check green.
          # 2026-09-01: bumped 1.2.17 -> 1.2.18. Build 1115 was cut as 1.2.17 and
          # UPLOADED to the Play Console (version code 1115 reached "Preview and
          # confirm" on an internal testing release), so the name is spent
          # whether or not it was rolled out. Reusing it would put two different
          # builds under one version string in the Console, in crash reports and
          # on the member's About screen. 1.2.18 carries the native debug
          # symbols that 1115 was missing.
          sed -i 's/versionName "1.0"/versionName "1.2.18"/' android/app/build.gradle
          echo "versionCode=${VC} versionName=1.2.18 (1.2.11 / build 1102 went public)"
          grep -E "versionCode|versionName" android/app/build.gradle
          cat android/variables.gradle

      - name: Install Android NDK (needed to package native debug symbols)
        run: |
          echo y | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --install "ndk;27.1.12297006" > /dev/null
          echo "NDK 27.1.12297006 installed"

      - name: Enable R8 minification + native debug symbols (fixes both Play warnings)
        run: |
          python3 - <<'EOF'
          import re
          p = "android/app/build.gradle"
          s = open(p).read()
          # Pin the NDK so debugSymbolLevel has a toolchain to use.
          s = re.sub(r"(android\s*\{)", r'\1\n    ndkVersion "27.1.12297006"', s, count=1)
          # 1) R8 code shrinking ON for release. AGP >= 4.1 embeds the resulting
          #    deobfuscation map inside the AAB (BUNDLE-METADATA), which clears
          #    Play's "no deobfuscation file" warning and reduces app size.
          # 2) debugSymbolLevel SYMBOL_TABLE embeds native symbols in the AAB,
          #    clearing Play's "native code without debug symbols" warning.
          s = re.sub(r"(buildTypes\s*\{\s*release\s*\{)",
                     r"\1\n            minifyEnabled true\n            shrinkResources true\n            ndk { debugSymbolLevel 'FULL' }",
                     s, count=1)
          # Capacitor's template already carries "minifyEnabled false" further
          # down the same block; in Gradle the LAST assignment wins - drop it.
          s = re.sub(r"\n\s*minifyEnabled false", "", s)
          s = re.sub(r"\n\s*shrinkResources false", "", s)
          # Play "R8 optimization" recommendation: the template's default rule
          # file skips R8's optimizing passes - switch to the optimize variant.
          s = s.replace("proguard-android.txt", "proguard-android-optimize.txt")
          open(p, "w").write(s)
          i = s.index("buildTypes")
          print(s[i:i+320])
          EOF
          # The Capacitor/Cordova bridge finds plugins by reflection - R8 must not
          # strip or rename any of it, or the app breaks at runtime.
          cat >> android/app/proguard-rules.pro <<'PRO'
          -keep class com.getcapacitor.** { *; }
          -keep class org.apache.cordova.** { *; }
          -keep @com.getcapacitor.annotation.CapacitorPlugin class * { *; }
          -keepclassmembers class * {
            @com.getcapacitor.PluginMethod <methods>;
            @com.getcapacitor.annotation.PermissionCallback <methods>;
            @com.getcapacitor.annotation.ActivityCallback <methods>;
          }
          -keepclassmembers class * {
            @android.webkit.JavascriptInterface <methods>;
          }
          -keep class com.fiftymmretina.app.** { *; }
          -dontwarn org.apache.cordova.**
          PRO
          echo "--- proguard-rules.pro ---"
          cat android/app/proguard-rules.pro

      - name: Add OAuth deep-link intent filter (app.fiftymmretina scheme)
        run: |
          python3 - <<'EOF'
          path = 'android/app/src/main/AndroidManifest.xml'
          s = open(path).read()
          f = '''
                      <intent-filter>
                          <action android:name="android.intent.action.VIEW" />
                          <category android:name="android.intent.category.DEFAULT" />
                          <category android:name="android.intent.category.BROWSABLE" />
                          <data android:scheme="app.fiftymmretina" />
                      </intent-filter>
          '''
          assert '</activity>' in s, 'activity tag not found'
          assert 'app.fiftymmretina' not in s, 'intent filter already present'
          s = s.replace('</activity>', f + '\n        </activity>', 1)
          open(path, 'w').write(s)
          print('Intent filter injected.')
          EOF

      - name: Generate icons and splash screens
        run: |
          npm install --no-audit --no-fund -D @capacitor/assets@3.0.5
          npx capacitor-assets generate --android \
            --iconBackgroundColor '#0f172a' --splashBackgroundColor '#0f172a' || true

      - name: Place Firebase config
        run: cp google-services.json android/app/google-services.json

      - name: Sync web build into native project
        run: npx cap sync android

      # -------------------------------------------------------------------
      # PROVE THE BUNDLE CARRIES TODAY'S APP — not a stale one.
      #
      # Owner requirement (2026-08-12): before any build is handed over,
      # confirm the merged work is actually inside it — Top Contributor
      # score, the 46-category strip, and the comment fixes. Every string
      # below was verified present in a real production build of current
      # main before this step was written; each one survives minification
      # because it is either user-facing text or a DOM dataset key.
      #
      # The reversed-typing fix itself cannot be string-checked (the
      # function name is minified away) — it is guarded instead by the
      # noComponentDefinedInRender test, which runs in the blocking test
      # suite earlier in this same job.
      # -------------------------------------------------------------------
      - name: Prove the synced app is TODAY'S app (contributor score, categories, comment fixes)
        run: |
          set -euo pipefail
          PUB="android/app/src/main/assets/public"
          test -d "$PUB/assets" || { echo "::error::No synced web assets at $PUB — cap sync did not run?"; exit 1; }
          check () {
            if grep -rqlF "$1" "$PUB"/assets/*.js; then
              echo "OK   $2"
            else
              echo "::error::MISSING from bundle: $2 (marker '$1'). This AAB would NOT contain that feature. Refusing to build."
              exit 1
            fi
          }
          check "get_contributor_scores" "Top Contributor score wiring"
          check "Top Contributor"        "Top Contributor UI"
          check "All categories"         "Category strip grid modal"
          check "Photojournalism"        "Full 46-category list"
          check "Pinned comment"         "Comments UI"
          # ⚠ `caretPlaced` MOVED ON 2026-08-31 — the marker, not the feature.
          # It lived in AdComments.tsx as `el.dataset.caretPlaced` until the
          # promotion replaced that hand-rolled comment row with the shared
          # CommentThread. The behaviour went with it into MentionInput.tsx;
          # the string did not, and run #114 refused to build. The gate was
          # RIGHT — it keys on an implementation detail, so a re-write reads
          # exactly like a deletion and it cannot tell them apart.
          # The marker now sits in MentionInput.tsx beside the setSelectionRange
          # call it certifies. Evidence the feature was never lost:
          # AdComments.tsx renders CommentThread; CommentThread renders
          # <MentionInput autoFocus/> for an edit; MentionInput places the caret.
          check "caretPlaced"            "Edit-caret fix (2026-08-12, now in MentionInput)"
          echo "All feature proofs passed — this bundle is current main."

      - name: Install monochrome notification icon and manifest meta-data
        run: |
          set -euo pipefail
          for d in mdpi hdpi xhdpi xxhdpi xxxhdpi; do
            mkdir -p "android/app/src/main/res/drawable-$d"
            cp "resources/android/notification/ic_notification-$d.png" "android/app/src/main/res/drawable-$d/ic_notification.png"
          done
          mkdir -p android/app/src/main/res/values
          cat > android/app/src/main/res/values/notification_colors.xml <<'XML'
          <?xml version="1.0" encoding="utf-8"?>
          <resources>
              <color name="notification_accent">#C6A04A</color>
          </resources>
          XML
          python3 - <<'PY'
          import pathlib
          p = pathlib.Path("android/app/src/main/AndroidManifest.xml")
          s = p.read_text()
          assert "default_notification_icon" not in s, "meta-data already present"
          assert s.count("</application>") == 1, "unexpected manifest shape"
          meta = (
              '<meta-data\n'
              '            android:name="com.google.firebase.messaging.default_notification_icon"\n'
              '            android:resource="@drawable/ic_notification" />\n'
              '        <meta-data\n'
              '            android:name="com.google.firebase.messaging.default_notification_color"\n'
              '            android:resource="@color/notification_accent" />\n'
              '    </application>'
          )
          p.write_text(s.replace("</application>", meta))
          print("manifest patched")
          PY
          echo "--- notification drawables ---"
          ls -1 android/app/src/main/res/drawable-*/ic_notification.png
          echo "--- manifest meta-data lines ---"
          grep -c default_notification android/app/src/main/AndroidManifest.xml

      # -------------------------------------------------------------------
      # PLAY RECOMMENDATION 1 of 2 — "Improve your app's performance with
      # bitmap image optimization".
      #
      # Play flags PNG/JPEG drawables that would be smaller as WebP. Every
      # drawable here is GENERATED (launcher icons, splash screens, the
      # notification icon), so converting them costs nothing at authoring time
      # and shrinks the download for all 85 installs.
      #
      # LOSSLESS, deliberately. These are logos and flat-colour icons; lossy
      # WebP puts visible fringing on hard edges and a fuzzy app icon is worse
      # than a slightly larger one.
      #
      # ⚠ NINE-PATCH FILES ARE EXCLUDED. `*.9.png` carries its stretch markers
      # in a 1px border that cwebp does not understand — converting one
      # silently produces an image Android then stretches wrongly.
      #
      # The resource NAME is unchanged (ic_notification.png → ic_notification
      # .webp is still @drawable/ic_notification), so the notification-icon
      # proof step above and the manifest references keep working.
      #
      # Play's OTHER recommendation — R8 full mode — is deliberately NOT done
      # here. Owner's call, 2026-08-12: full mode strips by reflection
      # assumptions, Capacitor reaches plugins by reflection, and the only
      # build that would expose a breakage is the release AAB — debug APKs do
      # not run R8 at all, so the sideload build cannot validate it. It ships
      # alone in a later release where a crash has an obvious cause.
      # -------------------------------------------------------------------
      - name: Convert generated PNGs to WebP (Play bitmap recommendation)
        run: |
          set -euo pipefail
          RES=android/app/src/main/res

          # ─────────────────────────────────────────────────────────────────
          # ⚠ THIS STEP MUST NEVER BE ABLE TO FAIL THE RELEASE.
          #
          # WebP conversion is a Play SIZE RECOMMENDATION, not a requirement.
          # An .aab full of PNGs uploads, installs and runs exactly the same.
          #
          # It used to run `sudo apt-get update && apt-get install webp` bare,
          # under `set -e`. That is the same call that killed builds 1107 and
          # 1109: apt could not reach Ubuntu's mirror, did NOT fail fast, and
          # burned the whole job timeout. Neither run produced an artifact.
          # The header above records that lesson and says the package manager
          # is no longer touched — but that fix was only ever applied to the
          # UI gate. This step kept calling apt, so a mirror outage on
          # somebody else's infrastructure could still throw away a
          # twenty-minute release build for an optimisation nobody needs.
          #
          # Now: bounded by `timeout` so it cannot hang, non-fatal so it
          # cannot fail, and skipped entirely if cwebp is unavailable. The
          # launcher-icon assertion at the end still runs in BOTH paths — that
          # one is a real check and it is not being relaxed.
          # ─────────────────────────────────────────────────────────────────
          if ! command -v cwebp >/dev/null 2>&1; then
            if ! timeout 240 sudo apt-get update -qq; then
              echo "::warning::apt-get update did not finish in 240s — skipping WebP conversion."
            elif ! timeout 240 sudo apt-get install -y -qq webp; then
              echo "::warning::could not install the webp package — skipping WebP conversion."
            fi
          fi

          if ! command -v cwebp >/dev/null 2>&1; then
            echo "::warning::cwebp unavailable — shipping PNGs unconverted. This is a Play SIZE RECOMMENDATION only; the bundle is complete and installable. Not failing the release for it."
            echo "--- notification drawable (PNG path) ---"
            ls -1 "$RES"/drawable-*/ic_notification.* || true
            ls "$RES"/mipmap-*/ic_launcher.* >/dev/null
            echo "launcher icons present — continuing without WebP conversion"
            exit 0
          fi

          before=$(du -sk "$RES" | cut -f1)
          converted=0; skipped=0
          # -print0/read -d handles the spaces Capacitor's generator can emit.
          while IFS= read -r -d '' f; do
            case "$f" in
              *.9.png) skipped=$((skipped+1)); continue ;;
            esac
            if cwebp -quiet -lossless "$f" -o "${f%.png}.webp"; then
              rm "$f"
              converted=$((converted+1))
            else
              echo "::warning::cwebp failed on $f — leaving the PNG in place"
              rm -f "${f%.png}.webp"
            fi
          done < <(find "$RES" -type f -name '*.png' -print0)
          after=$(du -sk "$RES" | cut -f1)
          echo "converted=$converted  skipped_ninepatch=$skipped"
          echo "res/ ${before}KB -> ${after}KB"
          echo "--- notification drawable survives under its resource name ---"
          ls -1 "$RES"/drawable-*/ic_notification.* || true
          # A launcher icon must still exist, whatever its extension.
          ls "$RES"/mipmap-*/ic_launcher.* >/dev/null

      # -------------------------------------------------------------------
      # OPTIONAL SIGNING — only runs if you've added the keystore secret.
      # With no secret, this is a no-op and the build stays unsigned (as today).
      # -------------------------------------------------------------------
      - name: Configure release signing (only if keystore secret is set)
        env:
          KS_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          if [ -z "$KS_B64" ]; then
            echo "::notice::No ANDROID_KEYSTORE_BASE64 secret set — building UNSIGNED. Add the keystore + password secrets to auto-sign."
            exit 0
          fi
          echo "$KS_B64" | base64 -d > android/app/release.keystore

          # ---------------------------------------------------------------
          # THE KEYSTORE IS THE SOURCE OF TRUTH FOR THE ALIAS — NOT A SECRET.
          #
          # History, so this is never re-broken: builds up to #75 signed
          # fine with the alias hardcoded to "upload". Build #76 "fixed"
          # signing to prefer the ANDROID_KEY_ALIAS secret — and #76, #77,
          # #78 and #79 all died at :app:signReleaseBundle with "No key
          # with alias '***' found", because the secret's value is not an
          # alias that exists in this keystore. A secret can be typed
          # wrong; the keystore cannot lie about its own contents. So:
          # ask the keystore what aliases it actually holds, use the
          # secret only if it names one of them, and fall back to the
          # store's own single alias otherwise. Alias names are printed
          # (they are not secret material); passwords never are.
          # ---------------------------------------------------------------
          ALIASES=$(keytool -list -keystore android/app/release.keystore \
                    -storepass "$KEYSTORE_PASSWORD" 2>/dev/null \
                    | sed -n 's/^\(.*\), [A-Z][a-z]* [0-9].*, PrivateKeyEntry,.*$/\1/p')
          if [ -z "$ALIASES" ]; then
            # Fallback parse for keytool output variations: lines end with
            # "PrivateKeyEntry," and start with the alias before the first comma.
            ALIASES=$(keytool -list -keystore android/app/release.keystore \
                      -storepass "$KEYSTORE_PASSWORD" 2>/dev/null \
                      | grep -i "PrivateKeyEntry" | cut -d, -f1)
          fi
          if [ -z "$ALIASES" ]; then
            echo "::error::Could not read any private-key alias from the keystore. Either ANDROID_KEYSTORE_PASSWORD is wrong or the keystore file is not a keystore."
            exit 1
          fi
          COUNT=$(echo "$ALIASES" | grep -c .)
          echo "Keystore holds $COUNT private-key alias(es): $ALIASES"

          WANT=$(printf '%s' "${KEY_ALIAS:-}" | tr -d '[:space:]')
          RESOLVED=""
          if [ -n "$WANT" ] && echo "$ALIASES" | grep -qxF "$WANT"; then
            RESOLVED="$WANT"
            echo "ANDROID_KEY_ALIAS matches a real alias in the keystore — using it."
          elif [ "$COUNT" -eq 1 ]; then
            RESOLVED=$(echo "$ALIASES" | head -1)
            if [ -n "$WANT" ]; then
              echo "::warning::ANDROID_KEY_ALIAS does not name any alias in the keystore. Using the keystore's own single alias '$RESOLVED' instead — this is what builds <=75 effectively did. Fix the secret at your convenience; the build no longer depends on it."
            else
              echo "No ANDROID_KEY_ALIAS secret — using the keystore's single alias '$RESOLVED'."
            fi
          else
            echo "::error::ANDROID_KEY_ALIAS matches nothing and the keystore holds $COUNT aliases, so there is no safe automatic choice. Real aliases are: $ALIASES"
            exit 1
          fi
          echo "RESOLVED_KEY_ALIAS=$RESOLVED" >> "$GITHUB_ENV"

          # ---------------------------------------------------------------
          # PROVE THE KEY PASSWORD BEFORE GRADLE EVER RUNS.
          #
          # The verification differs by keystore TYPE, and this was tested
          # against real keystores of both types before shipping:
          #
          #   PKCS12  the key password IS the store password by definition,
          #           and keytool silently IGNORES a wrong -keypass — so a
          #           certreq "test" would bless a wrong secret. No test is
          #           possible or needed: the store password (which already
          #           opened the store above) is the key password.
          #   JKS     keytool -certreq needs the PRIVATE key, so it fails
          #           on a wrong key password (verified: wrong → exit 1,
          #           right → exit 0). A one-second test that replaces a
          #           six-minute Gradle run ending in the same discovery.
          #
          # Only the NAME of the working source is exported; the password
          # value itself never leaves the secrets context.
          # ---------------------------------------------------------------
          STORETYPE=$(keytool -list -keystore android/app/release.keystore \
                      -storepass "$KEYSTORE_PASSWORD" 2>/dev/null \
                      | sed -n 's/^Keystore type: *//p' | head -1)
          echo "Keystore type: ${STORETYPE:-unknown}"
          KEYPASS_SOURCE=""
          if [ "$STORETYPE" = "PKCS12" ]; then
            KEYPASS_SOURCE="store"
            echo "PKCS12 keystore — the key password is the store password by definition. Using it."
          elif [ -n "${KEY_PASSWORD:-}" ] && keytool -certreq -alias "$RESOLVED" \
               -keystore android/app/release.keystore \
               -storepass "$KEYSTORE_PASSWORD" -keypass "$KEY_PASSWORD" \
               -file /dev/null >/dev/null 2>&1; then
            KEYPASS_SOURCE="key"
            echo "ANDROID_KEY_PASSWORD unlocks the key '$RESOLVED' — verified with keytool."
          elif keytool -certreq -alias "$RESOLVED" \
               -keystore android/app/release.keystore \
               -storepass "$KEYSTORE_PASSWORD" -keypass "$KEYSTORE_PASSWORD" \
               -file /dev/null >/dev/null 2>&1; then
            KEYPASS_SOURCE="store"
            echo "Key '$RESOLVED' uses the STORE password (as builds <=75 assumed) — verified with keytool."
            if [ -n "${KEY_PASSWORD:-}" ]; then
              echo "::warning::ANDROID_KEY_PASSWORD does not unlock this key; the store password does. Fix the secret at your convenience; the build no longer depends on it."
            fi
          else
            echo "::error::Neither ANDROID_KEY_PASSWORD nor ANDROID_KEYSTORE_PASSWORD unlocks the key '$RESOLVED'. Signing is impossible until the correct key password is in the secrets."
            exit 1
          fi
          echo "KEYPASS_SOURCE=$KEYPASS_SOURCE" >> "$GITHUB_ENV"
          python3 - <<'PY'
          import re
          p = "android/app/build.gradle"
          s = open(p).read()
          if "signingConfigs" not in s:
              signing = (
                  "\n    signingConfigs {\n"
                  "        release {\n"
                  "            storeFile file(\"release.keystore\")\n"
                  "            storePassword System.getenv(\"KEYSTORE_PASSWORD\")\n"
                  # ⚠ THIS IS PYTHON. Comments are `#`, not `//`. Build #77 died
                  # here with a SyntaxError because these seven lines were
                  # written as `//` — inside a heredoc that Python parses.
                  #
                  # The alias and key password come from the secrets the header
                  # advertises. The old version hardcoded the alias "upload" and
                  # reused the STORE password as the KEY password, so a keystore
                  # whose alias differs, or whose key password differs, failed
                  # with "No key with alias 'upload' found". The Groovy elvis
                  # defaults keep the old behaviour when those optional secrets
                  # are absent.
                  # RESOLVED_KEY_ALIAS was verified against the keystore's
                  # real contents in the shell above; EFFECTIVE_KEY_PASSWORD
                  # is the password keytool PROVED unlocks that key. Gradle
                  # gets only verified values now — it can no longer be the
                  # place where a wrong secret is first discovered.
                  "            keyAlias System.getenv(\"RESOLVED_KEY_ALIAS\")\n"
                  "            keyPassword System.getenv(\"EFFECTIVE_KEY_PASSWORD\")\n"
                  "        }\n"
                  "    }\n"
              )
              s = re.sub(r"(android\s*\{)", r"\1" + signing, s, count=1)
          s = re.sub(r"(buildTypes\s*\{\s*release\s*\{)",
                     r"\1\n            signingConfig signingConfigs.release", s, count=1)
          open(p, "w").write(s)
          print("Release signing config injected — this build will be SIGNED.")
          PY

      - name: Build release bundle
        env:
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          # KEYPASS_SOURCE says which password keytool PROVED works for the
          # resolved alias (set in the signing step above). Hand Gradle that
          # one, under a name the injected config reads. When no keystore
          # secret is set, KEYPASS_SOURCE is empty and the build is unsigned,
          # exactly as before.
          if [ "${KEYPASS_SOURCE:-}" = "key" ]; then
            export EFFECTIVE_KEY_PASSWORD="$KEY_PASSWORD"
          elif [ "${KEYPASS_SOURCE:-}" = "store" ]; then
            export EFFECTIVE_KEY_PASSWORD="$KEYSTORE_PASSWORD"
          fi
          cd android
          chmod +x gradlew
          ./gradlew bundleRelease --no-daemon --stacktrace

      # ═══════════════════════════════════════════════════════════════════
      # BLOCKING. THIS IS THE ONE THAT SHIPS.
      #
      # Until 2026-08-14 the ONLY check that `assets/public/index.html` existed
      # ran against the DEBUG APK inside a `continue-on-error: true` step. An
      # AAB containing no web bundle at all would have uploaded green, and the
      # first person to find out would have been a member with a white screen.
      #
      # `bundleRelease` is what goes to Play, so it is what gets asserted, with
      # no continue-on-error. The index.html check is exact; the JS-asset check
      # is a count rather than a named file because Vite hashes the names.
      # ═══════════════════════════════════════════════════════════════════
      - name: Prove the web bundle is inside the RELEASE bundle (blocking)
        run: |
          set -euo pipefail
          AAB=android/app/build/outputs/bundle/release/app-release.aab
          test -f "$AAB" || { echo "::error::no release AAB was produced"; exit 1; }

          if ! unzip -l "$AAB" | grep -q "base/assets/public/index.html"; then
            echo "::error::base/assets/public/index.html is NOT in the AAB — the app would open to a white screen"
            unzip -l "$AAB" | grep -c "base/assets/" || true
            exit 1
          fi
          echo "OK: base/assets/public/index.html present"

          JS=$(unzip -l "$AAB" | grep -c "base/assets/public/assets/.*\.js" || true)
          if [ "$JS" -lt 1 ]; then
            echo "::error::no JavaScript assets under base/assets/public/assets — the bundle is empty"
            exit 1
          fi
          echo "OK: $JS JavaScript asset(s) inside the AAB"

          CSS=$(unzip -l "$AAB" | grep -c "base/assets/public/assets/.*\.css" || true)
          echo "CSS assets inside the AAB: $CSS"

      # ─────────────────────────────────────────────────────────────────────
      # ⚠ PLAY TOLD US THIS WAS MISSING. NOW THE BUILD CHECKS IT.
      #
      # Version code 1115 uploaded clean except for one Play warning:
      #   "This App Bundle contains native code, and you've not uploaded debug
      #    symbols. We recommend you upload a symbol file..."
      #
      # The build already asked for symbols — `ndk { debugSymbolLevel ... }` is
      # set in the R8 step — but NOTHING EVER CHECKED THE RESULT, so a setting
      # that silently did nothing looked identical to one that worked. That is
      # the same shape as every other defect in this repository's history: the
      # intent was right and the artefact was never read.
      #
      # Symbols live in the bundle at BUNDLE-METADATA/com.android.tools.build.
      # debugsymbols/. This step lists the native libraries, lists the symbol
      # entries, and REFUSES to ship a bundle that has the former without the
      # latter. Without symbols, every native crash and ANR in the Play Console
      # is unreadable addresses.
      #
      # If a future build stops here: the .so list printed below names exactly
      # which libraries are present, which is the information needed to decide
      # whether the symbols can be produced or must be sourced another way.
      # ─────────────────────────────────────────────────────────────────────
      - name: Prove native debug symbols are in the bundle (blocking)
        run: |
          set -euo pipefail
          AAB=android/app/build/outputs/bundle/release/app-release.aab
          test -f "$AAB"

          # ⚠ THREE LIBRARIES CANNOT BE SYMBOLISED, AND THAT IS GOOGLE'S DOING.
          #
          # Run #116 stopped here: 12 native library files, zero symbols. The
          # 12 are three AndroidX libraries across four ABIs:
          #
          #   libimage_processing_util_jni.so   androidx.camera:camera-core
          #   libsurface_util_jni.so            androidx.camera:camera-core
          #   libdatastore_shared_counter.so    androidx.datastore
          #
          # camera-core arrives through @capacitor/camera. Verified by pulling
          # the AAR straight from Google's Maven and reading the ELF:
          #
          #   readelf -S libimage_processing_util_jni.so
          #       -> .dynsym and .shstrtab only. NO .symtab. NO .debug_* .
          #   nm --debug-syms libimage_processing_util_jni.so
          #       -> "no symbols"
          #   size in the AAR = 29008 bytes = the size in our bundle. Verbatim.
          #
          # GOOGLE SHIPS THEM STRIPPED. debugSymbolLevel cannot extract what was
          # never there, and no setting in this file will change that. Play's
          # message is advisory — it says "We recommend" — and build 1115
          # uploaded and reached "Preview and confirm" carrying it.
          #
          # So these three are allowed through BY NAME. Anything else with no
          # symbols still fails: our own native code, or a new dependency whose
          # symbols we could have had. The gate keeps its teeth for the case it
          # can actually catch, and stops blocking a release for a condition
          # that cannot be satisfied.
          KNOWN_STRIPPED="libimage_processing_util_jni.so libsurface_util_jni.so libdatastore_shared_counter.so"

          echo "--- native libraries in the bundle ---"
          unzip -l "$AAB" | grep -E 'base/lib/[^/]+/.+\.so' || echo "(none)"
          SO_NAMES=$(unzip -l "$AAB" | grep -oE 'base/lib/[^/]+/[^ ]+\.so' | xargs -r -n1 basename | sort -u || true)
          SO=$(unzip -l "$AAB" | grep -cE 'base/lib/[^/]+/.+\.so' || true)
          echo "native .so files: $SO   distinct libraries: $(echo "$SO_NAMES" | grep -c . || true)"

          echo "--- debug symbol metadata ---"
          unzip -l "$AAB" | grep 'BUNDLE-METADATA/com.android.tools.build.debugsymbols' || echo "(none)"
          SYM=$(unzip -l "$AAB" | grep -c 'BUNDLE-METADATA/com.android.tools.build.debugsymbols' || true)
          echo "debug symbol entries: $SYM"

          if [ "$SO" -eq 0 ]; then
            echo "No native libraries in this bundle — nothing to symbolise."
            exit 0
          fi

          UNEXPLAINED=""
          for n in $SO_NAMES; do
            case " $KNOWN_STRIPPED " in
              *" $n "*) echo "  allowed (Google ships it stripped): $n" ;;
              *)        echo "  NOT on the stripped list:           $n"; UNEXPLAINED="$UNEXPLAINED $n" ;;
            esac
          done

          if [ -n "$UNEXPLAINED" ] && [ "$SYM" -lt 1 ]; then
            echo "::error::These native libraries are not on the known-stripped list and the bundle carries NO debug symbols:$UNEXPLAINED . Either they are ours and debugSymbolLevel is not working, or a new dependency arrived whose symbols we could be shipping. Check before releasing."
            exit 1
          fi

          if [ "$SYM" -ge 1 ]; then
            echo "OK: $SYM debug-symbol entr(y/ies) packaged."
          else
            echo "OK: every native library present is one Google ships stripped. Play will still show its advisory 'no debug symbols' message; it cannot be satisfied for these three and it does not block publishing."
          fi

      - name: Prove the notification icon is actually inside the bundle
        run: |
          set -euo pipefail
          AAB=android/app/build/outputs/bundle/release/app-release.aab
          test -f "$AAB"
          echo "--- resource entries named ic_notification (resources.pb) ---"
          unzip -p "$AAB" base/resources.pb > /tmp/res.pb
          N=$(grep -c -a ic_notification /tmp/res.pb || true)
          echo "resources.pb matches: $N"
          test "$N" -ge 1
          echo "--- notification meta-data in the bundled manifest ---"
          unzip -p "$AAB" base/manifest/AndroidManifest.xml > /tmp/bin_manifest
          python3 - <<'PY'
          data = open("/tmp/bin_manifest", "rb").read()
          hay = data.decode("latin-1") + data.decode("utf-16-le", "ignore")
          missing = [k for k in ("default_notification_icon", "default_notification_color") if k not in hay]
          if missing:
              raise SystemExit("MISSING from the bundled manifest: " + ", ".join(missing))
          print("present: default_notification_icon")
          print("present: default_notification_color")
          PY
          echo "--- drawable files carrying the icon ---"
          unzip -l "$AAB" | grep -i ic_notification || echo "(paths renamed by resource optimisation; the resources.pb match above is the proof)"

      # -------------------------------------------------------------------
      # AN APK YOU CAN ACTUALLY PUT ON A PHONE.
      #
      # `bundleRelease` above produces an .aab, and an AAB CANNOT BE
      # SIDELOADED — it is a publishing format Play unpacks into per-device
      # APKs. So for "let me check it on my phone without the Play Store"
      # the AAB is useless, which is why this step exists.
      #
      # It builds the DEBUG variant on purpose. A release APK is unsigned
      # unless the keystore secrets are present, and Android refuses to
      # install an unsigned APK; the debug variant is self-signed with the
      # standard debug key and installs on any phone with "install unknown
      # apps" enabled. It is for testing only and must never go to Play.
      #
      # `continue-on-error` so a debug-variant problem can never block the
      # real release bundle that was already built and verified above.
      # -------------------------------------------------------------------
      - name: Build sideloadable debug APK (phone testing only)
        continue-on-error: true
        run: |
          cd android
          ./gradlew assembleDebug --no-daemon --stacktrace
          ls -la app/build/outputs/apk/debug/ || true

      # An APK that builds is not an APK that works. Prove the two things that
      # would make it a brick: the web bundle, and the camera plugin classes.
      - name: Prove the debug APK carries the app and the plugin
        continue-on-error: true
        run: |
          set -euo pipefail
          APK=$(ls android/app/build/outputs/apk/debug/*.apk | head -1)
          echo "APK: $APK  ($(du -h "$APK" | cut -f1))"
          unzip -l "$APK" | grep -q "assets/public/index.html"
          echo "OK: the web build is inside the APK"
          unzip -l "$APK" | grep -c "classes.*\.dex"
          # Plugin classes live in the dex; search the raw bytes for the package.
          if unzip -p "$APK" classes.dex | grep -a -q "com/capacitorjs/plugins/camera"; then
            echo "OK: camera plugin classes found in classes.dex"
          elif unzip -p "$APK" classes2.dex 2>/dev/null | grep -a -q "com/capacitorjs/plugins/camera"; then
            echo "OK: camera plugin classes found in classes2.dex"
          else
            echo "WARNING: camera plugin classes not located by raw dex scan"
            echo "(the Gradle assertion above is the authoritative check)"
          fi

      - name: Upload debug APK artifact
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: app-debug-apk-SIDELOAD-THIS
          path: android/app/build/outputs/apk/debug/*.apk
          retention-days: 14

      # An unsigned AAB is rejected by Play with a message that does not say
      # "unsigned". If the keystore secret IS set, the bundle must come out
      # signed — assert it here rather than discovering it in the Play Console.
      - name: Prove the release bundle is signed (only when a keystore is set)
        env:
          KS_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          set -euo pipefail
          AAB=android/app/build/outputs/bundle/release/app-release.aab
          if [ -z "$KS_B64" ]; then
            echo "::warning::No keystore secret — this AAB is UNSIGNED and Play will reject it."
            echo "Add ANDROID_KEYSTORE_BASE64 + ANDROID_KEYSTORE_PASSWORD (+ ANDROID_KEY_ALIAS, ANDROID_KEY_PASSWORD) to publish."
            exit 0
          fi
          if unzip -l "$AAB" | grep -qE "META-INF/.*\.(RSA|DSA|EC)"; then
            echo "OK: the release bundle carries a signature block"
          else
            echo "::error::Keystore secret is set but the AAB came out UNSIGNED."
            unzip -l "$AAB" | head -30
            exit 1
          fi

      - name: Upload AAB artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-release-aab
          path: android/app/build/outputs/bundle/release/app-release.aab
          retention-days: 14

      # -------------------------------------------------------------------
      # OPTIONAL AUTO-UPLOAD TO PLAY — only runs if PLAY_SERVICE_ACCOUNT_JSON
      # is set (and the build is signed). Pushes to the Internal testing track
      # as a DRAFT; you then review + roll out in the Play Console.
      # -------------------------------------------------------------------
      # ---------------------------------------------------------------------
      # PUBLISH TO PLAY — PRODUCTION track, as a DRAFT.
      #
      # Owner chose Production over Internal testing on 2026-08-12: he wants the
      # real app on the store, not a test build.
      #
      # ⚠ `status: draft` IS THE SAFETY CATCH AND MUST STAY. The release lands in
      # the Production track but is NOT live: nothing reaches a single user until
      # a human opens the Play Console and presses "Review release" → "Roll out".
      # Changing this to `completed` would make every merge an instant public
      # release with no one looking at it. Do not.
      #
      # Runs only when PLAY_SERVICE_ACCOUNT_JSON is set, so a repo without the
      # secret builds and uploads nothing.
      # ---------------------------------------------------------------------
      - name: Upload to Google Play (production, draft) — only if Play secret is set
        if: ${{ env.PLAY_SA != '' }}
        uses: r0adkll/upload-google-play@v1
        with:
          serviceAccountJsonPlainText: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON }}
          packageName: com.fiftymmretina.app
          releaseFiles: android/app/build/outputs/bundle/release/app-release.aab
          track: production
          status: draft

      - name: Upload debug info on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: build-reports
          path: |
            android/app/build/reports/
            android/build/reports/
          if-no-files-found: ignore
          retention-days: 3
