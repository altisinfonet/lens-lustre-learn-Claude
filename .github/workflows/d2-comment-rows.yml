name: D2 · C3 comment rows only in CommentThread

# ═══════════════════════════════════════════════════════════════════════════
# CONNECTS TO NOTHING. HOLDS NO SECRET. READS src/.
#
# Central-control plan C3: "a new comment list fails CI". The rule is
# eslint-rules/no-comment-rows.js, a per-file RATCHET over
# eslint-rules/no-comment-rows.baseline.json: more drawn comment lists than a
# file's baseline fails; fewer fails too until the baseline is lowered. Inline
# `eslint-disable` comments are ignored by this config (noInlineConfig).
#
# The self-test step writes a real new comment list into src/ and requires
# eslint to reject it, so a rule that stops working fails here.
#
# ⚠ NO `${{ ... }}` MAY APPEAR INSIDE ANY `run:` BLOCK — F-47's bright line.
# ═══════════════════════════════════════════════════════════════════════════

on:
  pull_request:
    branches: [main, staging]
  push:
    branches: [main, staging]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  comment-rows:
    name: Comment rows are drawn only by CommentThread
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
      - name: Clean install
        run: npm ci --no-audit --no-fund
      - name: Ratchet (more fails; fewer fails until the baseline is lowered)
        run: npx eslint -c eslint.comment-rows.config.js --quiet src
      - name: Self-test (a new comment list must fail)
        run: |
          set -u
          f=src/components/CommentRatchetSelfTest.tsx
          echo 'export const A = ({ comments }) => <div>{comments.map((c) => <p key={c.id}>{c.content}</p>)}</div>;' > "$f"
          if npx eslint -c eslint.comment-rows.config.js --quiet "$f"; then
            echo "The ratchet let a new comment list through."
            exit 1
          fi
          rm "$f"
          echo "Self-test passed: the new list was rejected."
