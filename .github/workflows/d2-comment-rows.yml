name: D2 · C3 comment rows only in CommentThread

# ═══════════════════════════════════════════════════════════════════════════
# CONNECTS TO NOTHING. HOLDS NO SECRET. READS src/.
#
# Central-control plan C3: "a new comment list fails CI". The rule is
# eslint-rules/no-comment-rows.js, a per-file RATCHET over
# eslint-rules/no-comment-rows.baseline.json: more drawn comment lists than a
# file's baseline fails; fewer fails too until the baseline is lowered. Inline
# `eslint-disable` comments are ignored by this config (noInlineConfig).
#
# tools/comment-rows-gate.mjs reads eslint's JSON, not just its exit code: the
# ratchet must have read more than 0 files including every baseline file, and a
# real new comment list must be rejected with this rule's own message. A crash,
# a parse error or an ignored file fails. commentRowsGate.test.ts proves each.
#
# ⚠ NO `${{ ... }}` MAY APPEAR INSIDE ANY `run:` BLOCK — F-47's bright line.
# ═══════════════════════════════════════════════════════════════════════════

on:
  pull_request:
    branches: [main, staging]
  push:
    branches: [main, staging]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  comment-rows:
    name: Comment rows are drawn only by CommentThread
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
      - name: Clean install
        run: npm ci --no-audit --no-fund
      - name: Ratchet and self-test (more than 0 files read; a new list rejected by this rule)
        run: node tools/comment-rows-gate.mjs
