name: D1 · Seeder guard check

# ═══════════════════════════════════════════════════════════════════════════
# CONNECTS TO NOTHING. HOLDS NO SECRET. RUNS ON EVERY PR THAT TOUCHES THE
# SEEDER, AND PROVES ITS PRODUCTION-REF GUARD REFUSES BEFORE IT IS TRUSTED.
#
# Phase 0 kickoff, deliverable 0.3, gate: "The guard is demonstrated FAILING
# against the production ref before the seeder is accepted." Phase-wise plan
# 0-D1-03: "…in a CI step whose printed output is quoted in the PR."
#
# The refusal does not need a database. scripts/db-lane-guard.mjs refuses a
# production-shaped credential BEFORE a socket is opened — that is the whole
# point of check 1 — so this workflow hands the seeder and the baseline a
# credential whose username names the production project ref and whose host
# is the RFC 2606 reserved name `invalid.invalid`, and requires each script to
# refuse. The password is the literal text NOT-A-REAL-PASSWORD. Nothing here
# is, or could be, a secret; the step's output can be quoted anywhere.
#
# WHY THIS IS A CONTROL AND NOT A DEMONSTRATION. A guard nobody has seen fire
# is a claim (C-34; standing rule: a suite never shown to detect a planted
# defect is not evidence about that class). This step plants the exact defect
# the guard exists to catch — a production credential where staging was
# expected — on every PR, so the day somebody weakens the guard the PR that
# does it goes red. It also runs the unit suite, which contains the guard's
# other refusals and the two regressions already caught while building it.
#
# ⚠ NO `${{ ... }}` MAY APPEAR INSIDE ANY `run:` BLOCK — F-47's bright line.
# ═══════════════════════════════════════════════════════════════════════════

on:
  pull_request:
    paths:
      - 'scripts/db-seed-staging.mjs'
      - 'scripts/db-seed-staging.test.mjs'
      - 'scripts/db-lane-guard.mjs'
      - '.github/workflows/d1-seed-staging.yml'
      - '.github/workflows/d1-seeder-guard-check.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  guard:
    name: The seeder refuses the production ref
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      # Production ref in the username, reserved host, placeholder password.
      # Shape-correct so check 1 parses it; content that can authenticate to
      # nothing. The guard must refuse it on the ref alone.
      DECOY_PRODUCTION_DSN: 'postgresql://postgres.jtdtehuqtinjxropkkcn:NOT-A-REAL-PASSWORD@invalid.invalid:5432/postgres'
      DECOY_DIRECT_DSN: 'postgresql://postgres:NOT-A-REAL-PASSWORD@invalid.invalid:5432/postgres'
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Unit suite — every case plants a defect and requires a refusal
        run: |
          set -euo pipefail
          node scripts/db-seed-staging.test.mjs

      # ── The seeder, handed production, must refuse by name ────────────────
      - name: SEEDER · refuses a production credential, by name, before connecting
        run: |
          set -euo pipefail
          set +e
          OUT=$(SUPABASE_DB_URL="$DECOY_PRODUCTION_DSN" node scripts/db-seed-staging.mjs --plan --rows 1000 2>&1)
          CODE=$?
          set -e
          echo "───────────────────────────────────────────────────────────"
          echo "$OUT"
          echo "───────────────────────────────────────────────────────────"
          echo "exit code: $CODE"
          if [ "$CODE" -eq 0 ]; then
            echo "::error::THE SEEDER ACCEPTED A PRODUCTION CREDENTIAL. The guard is broken. This PR must not merge."
            exit 1
          fi
          if ! printf '%s' "$OUT" | grep -q 'jtdtehuqtinjxropkkcn'; then
            echo "::error::The seeder refused, but its refusal does not NAME the production ref. A refusal a reader cannot attribute is not evidence."
            exit 1
          fi
          if printf '%s' "$OUT" | grep -q 'NOT-A-REAL-PASSWORD'; then
            echo "::error::The refusal echoed the credential's password. The scrubber is broken."
            exit 1
          fi
          echo "REFUSED, by name, without connecting. This is the gate's evidence for deliverable 0.3."

      # ── A direct (non-pooler) string parses to nothing and is refused ──────
      - name: SEEDER · refuses a direct string rather than guess a ref from the host
        run: |
          set -euo pipefail
          for script in "scripts/db-seed-staging.mjs --plan --rows 10"; do
            set +e
            # shellcheck disable=SC2086
            OUT=$(SUPABASE_DB_URL="$DECOY_DIRECT_DSN" node $script 2>&1)
            CODE=$?
            set -e
            echo "── $script → exit $CODE"
            echo "$OUT"
            if [ "$CODE" -eq 0 ]; then
              echo "::error::$script accepted a direct connection string, which carries no project ref. This PR must not merge."
              exit 1
            fi
          done
          echo "Refused. A shape the gate cannot read is a shape it must not wave through."

      - name: Nothing above opened a socket
        run: |
          echo "Every refusal above fired inside scripts/db-lane-guard.mjs check 1, before any connection attempt."
          echo "The host invalid.invalid is RFC 2606 reserved and resolves to nothing; had a script tried, it would have failed differently and later."
