name: D1 · first-post nudge — lane-shaped fixture

# ═══════════════════════════════════════════════════════════════════════════
# CONNECTS TO NOTHING BUT A THROWAWAY postgres:17.6 SERVICE CONTAINER.
# HOLDS NO SECRET: the container password below is a literal placeholder for a
# database that exists for the length of this job.
#
# WHAT IT PROVES (20261102_0200). scripts/db-first-post-nudge-fixture.mjs runs
# the REAL migration, PROBE and ROLLBACK (and push_on_notification() verbatim)
# over supabase/tests/first-post-nudge/ in a production shape (no switch row)
# and a staging shape (switch row present, off), and requires: the gate
# assertions red BEFORE the apply (fail-first); every refusal; then switch off
# = nothing queued or sent; switch on = reminders queued at +1/+3/+7 days, a
# due one sent once as bell + push + e-mail whose button opens the post flow;
# the first post cancels the rest; push / e-mail opt-outs and suppressed
# addresses respected; late rows never sent; the Health number correct on a
# known week and admin-only; the queue and the sender unreachable by members.
#
# ⚠ NO `${{ ... }}` MAY APPEAR INSIDE ANY `run:` BLOCK — F-47's bright line.
# ═══════════════════════════════════════════════════════════════════════════

on:
  pull_request:
    paths:
      - 'supabase/migrations/20261102_0200_first_post_nudge.sql'
      - 'supabase/migrations/PROBE_20261102_0200_first_post_nudge.sql'
      - 'supabase/rollback/20261102_0200_first_post_nudge_ROLLBACK.sql'
      - 'supabase/migrations/20261102_0201_first_post_nudge_switch_on.sql'
      - 'supabase/migrations/PROBE_20261102_0201_first_post_nudge_switch_on.sql'
      - 'supabase/rollback/20261102_0201_first_post_nudge_switch_on_ROLLBACK.sql'
      - 'supabase/tests/first-post-nudge/**'
      - 'scripts/db-first-post-nudge-fixture.mjs'
      - '.github/workflows/d1-first-post-nudge-fixture.yml'

permissions:
  contents: read

jobs:
  fixture:
    name: first-post reminders + Health number on lane-shaped databases
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:17.6
        env:
          POSTGRES_PASSWORD: fixture-not-a-secret
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    env:
      PGHOST: 127.0.0.1
      PGPORT: '5432'
      PGUSER: postgres
      PGPASSWORD: fixture-not-a-secret
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install psql
        run: sudo apt-get update -qq && sudo apt-get install -y -qq postgresql-client

      - name: The throwaway server
        run: psql -X -d postgres -tAc 'select version()'

      - name: Fixture — fail-first, apply, gate, PROBE, rollback, re-apply (both shapes)
        run: node scripts/db-first-post-nudge-fixture.mjs
