name: Apply a database migration

# ═══════════════════════════════════════════════════════════════════════════
# THE ONLY SANCTIONED WAY TO RUN SQL AGAINST PRODUCTION FROM THIS REPOSITORY.
#
# Owner, 2026-08-13: *"you run"* — asking Claude to apply the feed migration
# itself. It could not, and the reason is worth writing down rather than
# working around: applying a migration requires the production database
# credential, and an assistant should never hold that. Same rule as the
# upload keystore and the Play service-account JSON.
#
# This workflow is the way out. The credential lives in GitHub's secret store,
# where nobody reading this file and nothing running in it can print it. What
# it buys, beyond "somebody can run the SQL":
#
#   * an audit trail — who dispatched it, when, against which file
#   * the exact SQL echoed into the log BEFORE it runs
#   * ON_ERROR_STOP, so a failure stops at the first error instead of
#     half-applying and leaving the schema somewhere nobody designed
#   * one file per run, named explicitly — never "apply everything pending"
#
# ───────────────────────────────────────────────────────────────────────────
# ⚠ ONE-TIME SETUP, AND IT IS THE OWNER'S HANDS ONLY.
#
#   ⚠ CORRECTED 2026-09-01 (F-57). THE TEXT THAT USED TO BE HERE NAMED A
#   CONNECTION-STRING SHAPE THAT THIS FILE'S OWN GATE REJECTS. Following it
#   produced a secret that could never work, and cost a day to diagnose. The
#   original wording is preserved in the ledger; this is the corrected version.
#
#   Supabase dashboard → Connect (or Project Settings → Database) → Connection
#   string → the **SESSION POOLER** tab. Then GitHub → Settings → Environments
#   → `production` (or `staging`) → Environment secrets → SUPABASE_DB_URL:
#
#       Name:   SUPABASE_DB_URL
#       Value:  postgresql://postgres.<ref>:<password>@aws-<n>-<region>.pooler.supabase.com:5432/postgres
#
#   THREE THINGS MUST BE TRUE, AND EACH ONE IS ENFORCED OR RELIED ON BELOW:
#
#     1. The username is `postgres.<ref>` — WITH the dot and the project ref.
#        The step "The credential must point at the target database" parses the
#        ref out of the username to prove the credential matches the lane you
#        chose. A DIRECT string (`postgres@db.<ref>.supabase.co`) has a bare
#        `postgres` username, parses to nothing, and is REFUSED — correctly.
#     2. The port is 5432, the SESSION pooler. NOT 6543, the transaction pooler:
#        it does not support the multi-statement transactions these migrations
#        depend on, and a migration that silently loses its BEGIN is exactly the
#        failure this whole design exists to prevent.
#     3. The password is the REAL password. Supabase's dialog shows the literal
#        placeholder `[YOUR-PASSWORD]`; the actual password appears only once,
#        on the screen where you reset it. Paste over the placeholder — if the
#        stored string still contains `[` or `]`, authentication fails with
#        `FATAL: password authentication failed`. URL-encode any of
#        @ : / ? # [ ] % in the password, and leave no trailing newline.
#
#   The secret is an ENVIRONMENT secret, one per lane, because the job below
#   declares `environment:`. A repository-level secret of the same name is
#   SHADOWED by it and will never be read.
#
#   Until that secret exists this workflow refuses to run and says so. It
#   cannot half-work.
#
#   TO TEST A CREDENTIAL WITHOUT APPLYING ANYTHING, dispatch this workflow with
#   `supabase/migrations/PROBE_credential_connectivity_readonly.sql`. It opens a
#   transaction, asks the server four questions about itself, and commits. It
#   changes nothing. First proved green on production, run #10, 2026-09-01.
#
# ⚠ CORRECTED 2026-09-01 (F-57). THIS PARAGRAPH USED TO SAY THE `environment:`
#   LINE WAS COMMENTED OUT AND OPTIONAL. IT IS NEITHER. The job below carries
#   `environment: ${{ inputs.target }}`, live, and has done for some time. The
#   stale wording sent a reader looking for a repository secret that the job
#   would never read.
#
#   Both Environments (`production`, `staging`) exist and each holds its own
#   SUPABASE_DB_URL. What is still NOT configured, and is worth doing, is a
#   required reviewer: Settings → Environments → production → Required
#   reviewers → you. Then every dispatch waits for a human before touching the
#   database, even one dispatched by someone else.
#
# ───────────────────────────────────────────────────────────────────────────
# ⚠ MANUAL DISPATCH ONLY. There is deliberately no `push:` trigger.
#
# A migration must never run because someone merged something. The blast
# radius of "the schema changed itself" on a live app is unbounded, and the
# person best placed to decide when it happens is the person watching it.
# ═══════════════════════════════════════════════════════════════════════════

on:
  workflow_dispatch:
    inputs:
      target:
        description: "Which database. staging = ztzutckwdhetphwghuzj, production = jtdtehuqtinjxropkkcn."
        required: true
        type: choice
        options:
          - staging
          - production
      migration:
        description: "Path under supabase/migrations/ or supabase/rollback/ — e.g. supabase/migrations/20260813120000_feed_author_identity.sql"
        required: true
        type: string
      confirm:
        description: "Type the SAME path again. A mis-click cannot fire this."
        required: true
        type: string

# Two dispatches must never overlap on the same database — but staging and
# production are different databases, so they need not wait for each other.
concurrency:
  group: apply-migration-${{ inputs.target }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  apply:
    name: Apply SQL to ${{ inputs.target }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # The Environment supplies the credential, and its branch restriction is the
    # outer fence: production is bound to main, staging to staging. The two gates
    # in the first steps below are the inner fences, because a branch restriction
    # cannot tell you which database a secret actually points at.
    environment: ${{ inputs.target }}
    # ═══════════════════════════════════════════════════════════════════════
    # ⚠ EVERY DISPATCH INPUT IS BOUND HERE, AND NOWHERE ELSE.
    #
    # GitHub substitutes ${{ ... }} into a `run:` script's TEXT before any
    # shell exists. A value containing an apostrophe therefore closes the
    # quote and the remainder of it executes as shell -- ABOVE, and so
    # BEFORE, every check the step goes on to perform. The allowlist further
    # down does not fail to catch such a payload: it never runs.
    #
    # Bound here instead, the value is set by the runner as a process
    # environment variable. The script reads it as "$MIGRATION_PATH", and a
    # shell variable's contents are never re-parsed as script. THAT is the
    # fix. Quoting is not -- the quoting was already there, and the quoting
    # is what made it exploitable.
    #
    # THE RULE FOR THIS FILE: no `${{` may appear inside any `run:` block.
    # Not "none except the ones we decided were safe" -- six of the eleven
    # this replaced were safe, being `choice` inputs that cannot carry a
    # payload. A bright line survives handover; a reasoned exception makes
    # every future reader re-derive the safety argument, and that is where
    # scope falls off.
    # ═══════════════════════════════════════════════════════════════════════
    env:
      DB_URL: ${{ secrets.SUPABASE_DB_URL }}
      TARGET_LANE: ${{ inputs.target }}
      BRANCH_REF: ${{ github.ref_name }}
      MIGRATION_PATH: ${{ inputs.migration }}
      CONFIRM_PATH: ${{ inputs.confirm }}
    steps:
      - uses: actions/checkout@v4

      # ⚠ LANE GATE. The Environment is already branch-restricted, so this is a
      # second, independent check — and the one that produces a readable error
      # instead of a confusing "environment not accessible". Belt and braces on
      # the question "should this branch be allowed to touch this database?".
      - name: The branch must match the target
        run: |
          set -euo pipefail
          TARGET="$TARGET_LANE"
          REF="$BRANCH_REF"
          case "$TARGET" in
            production) WANT=main ;;
            staging)    WANT=staging ;;
            *) echo "::error::Unknown target '$TARGET'."; exit 1 ;;
          esac
          if [ "$REF" != "$WANT" ]; then
            echo "::error::target='$TARGET' must be dispatched from '$WANT', but this run is on '$REF'. Refusing."
            exit 1
          fi
          echo "Lane OK: target='$TARGET' dispatched from '$REF'."

      # The secret is checked FIRST so a missing one costs two seconds and says
      # plainly what to do, rather than failing later inside psql with
      # "connection to server failed", which reads like an outage.
      - name: Refuse to start without the database credential
        run: |
          if [ -z "$DB_URL" ]; then
            echo "::error::SUPABASE_DB_URL is not set. See the header of this file for the one-time setup — it takes about a minute and only the owner can do it."
            exit 1
          fi
          echo "Credential present. Its value is never printed by this workflow."

      # ⚠ REF ASSERTION — THE GATE THAT ACTUALLY PROTECTS PRODUCTION.
      #
      # Everything else here checks INTENT: which branch, which environment,
      # which typed path. None of them can see where the credential POINTS. A
      # staging Environment holding a production connection string satisfies
      # every other control in this file and then drops the migration on live
      # member data. One wrong paste, no warning.
      #
      # So the project ref is parsed out of the connection string's username
      # (Supabase poolers use `postgres.<ref>`) and compared against the target.
      # The ref is public — it is in every browser bundle — so printing it costs
      # nothing. $DB_URL itself is never echoed.
      - name: The credential must point at the target database
        run: |
          set -euo pipefail
          REF=$(printf '%s' "$DB_URL" | sed -E 's|^postgres(ql)?://([^:]+):.*|\2|' | cut -d. -f2)
          case "$TARGET_LANE" in
            production) EXPECT=jtdtehuqtinjxropkkcn ;;
            staging)    EXPECT=ztzutckwdhetphwghuzj ;;
            *) echo "::error::Unknown target '$TARGET_LANE'."; exit 1 ;;
          esac
          # A DIRECT (non-pooler) URI has username `postgres` with no `.<ref>`,
          # so this parses to "postgres", matches neither target, and the run is
          # refused. That is the correct direction to fail in: the pooler string
          # is what both Environments hold, and a shape this gate cannot read is
          # a shape it must not wave through.
          if [ -z "$REF" ]; then
            echo "::error::Could not parse a project ref from the credential. Expected a postgres://postgres.<ref>:... pooler connection string. Refusing rather than guessing."
            exit 1
          fi
          if [ "$REF" != "$EXPECT" ]; then
            echo "::error::secret points at '$REF', target is '$TARGET_LANE' — refusing"
            exit 1
          fi
          echo "Credential points at '$REF', which matches target '$TARGET_LANE'."

      # ⚠ PATH VALIDATION IS A SECURITY CONTROL, NOT TIDINESS.
      #
      # `migration` is free text typed into a dispatch box. Without these
      # checks it could name any file in the repository — or, with `..`, any
      # file on the runner — and this job would feed it to psql as SQL against
      # production. The allowlist is the two directories that exist to hold
      # reviewed SQL, and nothing else is reachable.
      - name: Validate the requested file
        run: |
          set -euo pipefail
          FILE="$MIGRATION_PATH"
          CONFIRM="$CONFIRM_PATH"

          if [ "$FILE" != "$CONFIRM" ]; then
            echo "::error::The two inputs do not match. Nothing was run."
            echo "  migration: $FILE"
            echo "  confirm:   $CONFIRM"
            exit 1
          fi

          case "$FILE" in
            supabase/migrations/*.sql|supabase/rollback/*.sql) : ;;
            *) echo "::error::Only files under supabase/migrations/ or supabase/rollback/ ending in .sql may be run. Got: $FILE"; exit 1 ;;
          esac

          case "$FILE" in
            *..*) echo "::error::Path traversal refused: $FILE"; exit 1 ;;
          esac

          if [ ! -f "$FILE" ]; then
            echo "::error::No such file on this commit: $FILE"
            echo "Files available:"
            ls -1 supabase/migrations/*.sql supabase/rollback/*.sql 2>/dev/null | tail -20
            exit 1
          fi

          echo "Will run: $FILE ($(wc -l < "$FILE") lines)"

      # Echoed in full BEFORE anything is executed, so the log is a record of
      # exactly what ran — not of what the file happened to say afterwards.
      - name: Show the SQL that is about to run
        run: |
          set -euo pipefail
          echo "───────────────────────────────────────────────────────────"
          cat -- "$MIGRATION_PATH"
          echo "───────────────────────────────────────────────────────────"

      - name: Install psql
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq postgresql-client
          psql --version

      # ⚠ ON_ERROR_STOP=1 IS LOAD-BEARING.
      #
      # Without it psql reports an error and CARRIES ON to the next statement.
      # A migration that half-applies to a live database leaves the schema in a
      # state nobody designed and no rollback file anticipates. With it, the
      # first error stops the run — and because these migrations wrap
      # themselves in BEGIN/COMMIT, the transaction rolls back and the database
      # is left exactly as it was.
      - name: Run it
        run: |
          set -euo pipefail
          psql "$DB_URL" \
            --set ON_ERROR_STOP=1 \
            --echo-errors \
            --no-psqlrc \
            -f "$MIGRATION_PATH"

      - name: Confirm
        run: |
          echo "✅ Applied: $MIGRATION_PATH"
          echo "Verify from the app, not only from SQL — that is the check that counts."
