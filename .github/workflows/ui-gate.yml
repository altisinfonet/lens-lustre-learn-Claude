# ─────────────────────────────────────────────────────────────────────────────
# THE UI GATE, RUN ON EVERY PUSH — NOT ONLY WHEN A BUILD IS CUT.
#
# The same gate is ALSO a hard dependency of `build-aab` in android-build.yml,
# and that is what actually blocks a release. This file exists because that one
# only runs when somebody cuts a build:
#
#     on: push: paths: [.github/workflows/android-build.yml, ANDROID_BUILD_TRIGGER]
#
# So a change to a component could sit on `main` for days having broken a
# control on some screen, and nothing would say so until release day — when the
# cost of finding out is highest and the temptation to wave it through is
# greatest. That is the opposite of what the owner asked for:
#
#   "we will build one gate you will break another gate which is working.
#    This should not happen"
#
# Catching it on the push that caused it is the whole point. Run #107 also
# proved the second reason this is needed: the gate's FIRST real execution
# failed for an environment reason (`Missing script: "ui:gate"`, because the
# workflow reached GitHub one commit before package.json did). It blocked the
# build correctly — but the only way to discover that was to cut a build, which
# is far too expensive a way to test a checker.
#
# ⚠ THIS FILE DOES NOT REPLACE THE GATE IN android-build.yml AND MUST NOT.
# A job in one workflow cannot be a `needs:` dependency of a job in another, so
# deleting the copy over there would let a release through with this one still
# green beside it. `uiGateCannotBeBypassed.test.ts` asserts both.
#
# It builds nothing, signs nothing, and touches neither Play nor the CDN.
# ─────────────────────────────────────────────────────────────────────────────
name: UI gate

on:
  push:
    branches: [main]
  pull_request:

jobs:
  ui-gate:
    name: Every control reachable, nothing regressed
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version

      # `npm ci`, never `npm install`, and no `|| true` fallback — the same
      # reasoning as every other job here: a failed install must fail.
      - name: Clean install
        run: npm ci --no-audit --no-fund

      # ⚠ RETRIED, AND CACHED, BECAUSE THIS STEP BLOCKS A RELEASE.
      #
      # Build 1107 was CANCELLED at the 30-minute timeout with the gate stuck
      # here: `npx playwright install --with-deps chromium` runs apt, and
      # Ubuntu's mirror was refusing — the log is pages of
      # `Ign: http://azure.archive.ubuntu.com ... InRelease`. Nothing was wrong
      # with the app, the sweep or the gate. The same step had taken 5 minutes
      # an hour earlier.
      #
      # A gate that blocks the build must not fail on somebody else's package
      # mirror. That is how a checker earns a reputation for crying wolf, and
      # this one is load-bearing.
      #
      # The cache removes the download entirely on a repeat run. The retry
      # covers a cold cache landing on a bad mirror. It STILL FAILS after three
      # attempts — this makes the step resilient, not permissive, and a genuine
      # inability to install Chromium remains a red gate and no .aab.
      - name: Cache the Playwright browser
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-chromium-${{ hashFiles('package-lock.json') }}

      # ⚠ NO `--with-deps`, AND THAT IS THE FIX. `--with-deps` runs apt, and apt
      # is what hung TWICE — builds 1107 and 1109 both sat on
      # `Ign: http://azure.archive.ubuntu.com ... InRelease` until the job
      # timed out. The retry added after the first failure did not help,
      # because apt does not fail fast: it retries internally for longer than
      # the whole job budget, so a three-attempt loop never reached attempt two.
      #
      # This downloads the browser binary from Playwright's own CDN and touches
      # no system package manager at all. GitHub's ubuntu runner image already
      # ships the shared libraries Chromium needs — it pre-installs Chrome,
      # Edge and Firefox — so the deps `--with-deps` would have fetched are
      # already present.
      #
      # ⚠ AND IF THEY ARE NOT, THIS STILL FAILS HONESTLY: Chromium will not
      # launch, the sweep cannot render a single scene, and the gate goes red
      # with no .aab. Nothing here is permitted to pass by assuming.
      - name: Install Chromium for Playwright
        run: |
          set -uo pipefail
          for attempt in 1 2 3; do
            if npx playwright install chromium; then
              echo "Chromium ready (attempt ${attempt})."
              exit 0
            fi
            echo "::warning::Chromium download attempt ${attempt} failed; retrying."
            sleep $((attempt * 15))
          done
          echo "::error::Chromium could not be downloaded after 3 attempts."
          exit 1

      # The same single command a person runs locally. A gate invoked one way
      # here and another way on a laptop has two behaviours, and the one that
      # matters is whichever nobody checked.
      - name: The UI gate
        run: npm run ui:gate

      # On a failure these are the difference between "it went red" and knowing
      # what it saw. On a baseline regression they are also how you tell a real
      # change from an environment one.
      - name: Upload the screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ui-sweep-screenshots
          path: /tmp/shots
          retention-days: 7
          if-no-files-found: warn
