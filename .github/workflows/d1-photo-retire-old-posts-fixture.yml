name: D1 · old post files queued for deletion (U7) — lane-shaped fixture

# ═══════════════════════════════════════════════════════════════════════════
# CONNECTS TO NOTHING BUT A THROWAWAY postgres:17.6 SERVICE CONTAINER.
# HOLDS NO SECRET: the container password below is a literal placeholder for a
# database that exists for the length of this job.
#
# WHAT IT PROVES (20261110_0104 + the 0102 rollback guard).
# scripts/db-photo-retire-old-posts-fixture.mjs runs 0101 → 0103 → 0102 → the
# REAL 0104, its PROBE and ROLLBACK on the U5 lane shapes: refusals (old files
# still shown, production switch not All members, no lane); exactly which 13
# old files are queued and which one is kept because a notification names it;
# the swap rollback never points a post back at a queued or deleted file.
# ═══════════════════════════════════════════════════════════════════════════

on:
  pull_request:
    paths:
      - 'supabase/migrations/20261110_0104_photo_retire_old_posts.sql'
      - 'supabase/migrations/PROBE_20261110_0104_photo_retire_old_posts.sql'
      - 'supabase/rollback/20261110_0104_photo_retire_old_posts_ROLLBACK.sql'
      - 'supabase/rollback/20261110_0102_photo_set_swap_ROLLBACK.sql'
      - 'supabase/tests/photo-retire-old-posts/**'
      - 'scripts/db-photo-retire-old-posts-fixture.mjs'
      - '.github/workflows/d1-photo-retire-old-posts-fixture.yml'

permissions:
  contents: read

jobs:
  fixture:
    name: old post files queued on lane-shaped databases
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:17.6
        env:
          POSTGRES_PASSWORD: fixture-not-a-secret
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    env:
      PGHOST: 127.0.0.1
      PGPORT: '5432'
      PGUSER: postgres
      PGPASSWORD: fixture-not-a-secret
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install psql
        run: sudo apt-get update -qq && sudo apt-get install -y -qq postgresql-client

      - name: The throwaway server
        run: psql -X -d postgres -tAc 'select version()'

      - name: Fixture — refusals, queue, keep, PROBE, rollbacks in both orders (both shapes)
        run: node scripts/db-photo-retire-old-posts-fixture.mjs
