name: Security

# THE STANDING GATE. Owner instruction, 2026-08-06:
#   "i need a permanent solution, system made scanner to constant investigate
#    after the changes you done but before publishing."
#
# Runs on every push and every pull request to main. Two halves, because the
# generic tools would never have caught the bug that actually bit this project
# (a deleted member keeping write access) — that was a policy and logic fault,
# not a pattern.
#
#   1. project-rules  — scripts/security-audit.mjs, THIS project's own rules.
#                       Fails on any CRITICAL or HIGH.
#   2. secrets        — full git history, not just the current tree. A key that
#                       was committed and later deleted is still exposed.
#   3. dependencies   — production dependencies only. The dev-tooling noise
#                       (vite, vitest, eslint) never reaches a member's phone
#                       and must not be allowed to bury a real finding.

on:
  push:
    branches: [main, staging]
  pull_request:
    branches: [main, staging]
  workflow_dispatch:

# Least privilege. gitleaks-action reads the history and annotates the run; it
# needs nothing else, and a scanner is the last place to hand out write scopes.
permissions:
  contents: read

jobs:
  project-rules:
    name: This project's own security rules
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      # No install needed: the script uses only Node built-ins, so it cannot be
      # broken by a dependency problem — which is exactly when you most want a
      # security gate to still run.
      - name: Run the security gate
        run: node scripts/security-audit.mjs

  secrets:
    name: Secret scan (full history)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0   # the whole history — a deleted secret is still leaked
      - name: gitleaks
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  dependencies:
    name: Dependency vulnerabilities (production only)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      # ⚠ F-72, 2026-09-04. THE GATE WAS FAILING FOR A REASON THAT WAS NOT A
      # VULNERABILITY, AND IT WOULD HAVE FAILED EVERY PR FROM NOW ON.
      #
      # npm retired the endpoint that npm 10's `npm audit` posts to. Run 840,
      # job 100955545912, printed it verbatim:
      #
      #   npm notice This endpoint is being retired. Use the bulk advisory
      #   endpoint instead.
      #   npm warn audit 400 Bad Request - POST
      #     https://registry.npmjs.org/-/npm/v1/security/audits/quick
      #
      # A 400 makes `npm audit` exit non-zero, which is indistinguishable at the
      # job level from "a critical vulnerability was found". That is the worst
      # possible failure mode for a security gate: it is red, so it looks like it
      # is working, and it is red for a reason that has nothing to do with this
      # repository. Left alone it would have been re-run, shrugged at, and then
      # merged past — which is how a gate stops being a gate.
      #
      # THE FIX IS TO MAKE THE GATE RUN, NOT TO MAKE IT PASS. npm 11 uses the
      # bulk advisory endpoint that replaced the retired one. The threshold below
      # is untouched, `--omit=dev` is untouched, and nothing is allowlisted.
      # Standing Rule 19 holds: a check is never weakened to get it green.
      #
      # Independently measured on staging e74d977 while diagnosing this, from a
      # completed `npm audit --omit=dev --json`: production CRITICAL = 0
      # (low 3, moderate 7, high 17). So the gate's own criterion was satisfied
      # the whole time it was reporting failure.
      - name: npm 11 — the retired audit endpoint is why this job failed (F-72)
        run: npm i -g npm@11
      - run: npm ci --no-audit --no-fund
      # Report everything for the record, then fail only on what ships to a
      # member. `|| true` on the first line is deliberate: it is the report,
      # not the gate.
      - name: Report (all dependencies)
        run: npm audit || true
      # RATCHET, NOT A WISH. Gating at `high` today would fail on 15 issues that
      # pre-date this gate, and a gate that is red from the day it is installed
      # gets ignored within a week — which is worse than not having one.
      # `critical` is achievable RIGHT NOW (production criticals are at 0 after
      # the jsPDF fix) and it genuinely blocks anything new and severe.
      # TIGHTEN THIS TO `high` once the outstanding 15 are worked through. That
      # is a real task, not a comment to leave sitting here forever.
      - name: Gate (production dependencies, critical)
        run: npm audit --omit=dev --audit-level=critical
