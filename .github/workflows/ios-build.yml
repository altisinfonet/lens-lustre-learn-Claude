name: iOS Build

# 50mm Retina World — iOS build, sign, and TestFlight upload.
#
# This is the iOS counterpart to android-build.yml. It builds the same React
# web bundle (dist/), wraps it in a fresh Capacitor iOS project, signs it with
# the Distribution Certificate + App Store provisioning profile, and uploads
# the resulting .ipa to TestFlight via the App Store Connect API.
#
# Required secrets (Settings -> Secrets and variables -> Actions):
#   BUILD_CERTIFICATE_BASE64        - distribution.p12, base64-encoded
#   BUILD_CERTIFICATE_PASSWORD      - export password for the .p12
#   BUILD_PROVISION_PROFILE_BASE64  - App Store provisioning profile, base64-encoded
#   APP_STORE_KEY_ID                - App Store Connect API Key ID
#   APP_STORE_ISSUER_ID             - App Store Connect API Issuer ID
#   APP_STORE_KEY_BASE64            - App Store Connect API private key (.p8), base64-encoded
#
# Bundle ID: com.fiftymmretina.app (must match capacitor.config.ts appId and
# the App ID used to generate the provisioning profile).
#
# SCOPE NOTE: this first iOS build wires up the core, iOS-safe plugins only
# (share, splash-screen, filesystem, camera, app, browser). Firebase push
# (@capacitor-firebase/messaging) and Play-style in-app updates
# (@capawesome/capacitor-app-update) are Android-specific setups — push needs
# an APNs key + proper iOS setup, and in-app updates don't work that way on
# iOS at all. Add push as a deliberate follow-up, not by just flipping it on.
#
# NODE 22, NOT 20 - matches android-build.yml. @capacitor/cli 8.5.0 requires it.
#
# Trigger: manual only (workflow_dispatch) until a first build is verified
# end-to-end. Once a build lands cleanly in TestFlight, uncomment the `push`
# trigger below to build iOS automatically on every push to main, same as
# Android does.

on:
  workflow_dispatch:
  # push:
  #   branches: [main]

concurrency:
  group: ios-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-ios:
    runs-on: macos-14
    timeout-minutes: 60
    env:
      BUNDLE_ID: com.fiftymmretina.app
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Build web bundle
        env:
          VITE_SUPABASE_URL: https://jtdtehuqtinjxropkkcn.supabase.co
          VITE_SUPABASE_PUBLISHABLE_KEY: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Imp0ZHRlaHVxdGluanhyb3Bra2NuIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODM1NzI3MjEsImV4cCI6MjA5OTE0ODcyMX0.qY8BI5LXb6uLzTwbpf8AleZ6UZyfeaOA0q4_TC5CEpo
          VITE_SUPABASE_PROJECT_ID: jtdtehuqtinjxropkkcn
        run: npm run build

      - name: Install Capacitor + iOS-safe native plugins (pinned)
        run: |
          npm install --no-audit --no-fund \
            @capacitor/core@8.5.0 @capacitor/cli@8.5.0 @capacitor/ios@8.5.0 \
            @capacitor/share@8.0.1 @capacitor/splash-screen@8.0.2 \
            @capacitor/filesystem@8.1.2 @capacitor/camera@8.2.2 \
            @capacitor/app@8.1.1 @capacitor/browser@8.0.4

      - name: Add iOS platform
        run: npx cap add ios

      - name: Sync web assets into iOS project
        run: npx cap sync ios

      - name: Verify synced assets exist
        run: |
          set -euo pipefail
          PUB="ios/App/App/public"
          test -f "$PUB/index.html" || { echo "::error::No synced web assets at $PUB - cap sync did not run?"; exit 1; }

      - name: Import Distribution Certificate + Provisioning Profile
        env:
          BUILD_CERTIFICATE_BASE64: ${{ secrets.BUILD_CERTIFICATE_BASE64 }}
          BUILD_CERTIFICATE_PASSWORD: ${{ secrets.BUILD_CERTIFICATE_PASSWORD }}
          BUILD_PROVISION_PROFILE_BASE64: ${{ secrets.BUILD_PROVISION_PROFILE_BASE64 }}
        run: |
          set -euo pipefail
          KEYCHAIN_PATH="$RUNNER_TEMP/app-signing.keychain-db"
          KEYCHAIN_PASSWORD="$(openssl rand -base64 24)"
          CERT_PATH="$RUNNER_TEMP/distribution.p12"
          PROFILE_PATH="$RUNNER_TEMP/profile.mobileprovision"

          echo -n "$BUILD_CERTIFICATE_BASE64" | base64 --decode -o "$CERT_PATH"
          echo -n "$BUILD_PROVISION_PROFILE_BASE64" | base64 --decode -o "$PROFILE_PATH"

          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"

          security import "$CERT_PATH" -P "$BUILD_CERTIFICATE_PASSWORD" -A \
            -t cert -f pkcs12 -k "$KEYCHAIN_PATH"
          security set-key-partition-list -S apple-tool:,apple: -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security list-keychain -d user -s "$KEYCHAIN_PATH" $(security list-keychains -d user | sed 's/"//g')

          mkdir -p ~/Library/MobileDevice/Provisioning\ Profiles
          cp "$PROFILE_PATH" ~/Library/MobileDevice/Provisioning\ Profiles/profile.mobileprovision

      - name: Read provisioning profile UUID and Team ID
        id: profile
        run: |
          set -euo pipefail
          PROFILE="$RUNNER_TEMP/profile.mobileprovision"
          UUID=$(security cms -D -i "$PROFILE" | plutil -extract UUID xml1 -o - - | sed -n 's/.*<string>\(.*\)<\/string>.*/\1/p')
          TEAM_ID=$(security cms -D -i "$PROFILE" | plutil -extract TeamIdentifier.0 xml1 -o - - | sed -n 's/.*<string>\(.*\)<\/string>.*/\1/p')
          echo "uuid=$UUID" >> "$GITHUB_OUTPUT"
          echo "team_id=$TEAM_ID" >> "$GITHUB_OUTPUT"

      - name: Set up Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - name: Archive
        env:
          TEAM_ID: ${{ steps.profile.outputs.team_id }}
          PROFILE_UUID: ${{ steps.profile.outputs.uuid }}
        run: |
          set -euo pipefail
          xcodebuild -workspace ios/App/App.xcworkspace \
            -scheme App \
            -configuration Release \
            -archivePath "$RUNNER_TEMP/App.xcarchive" \
            -destination 'generic/platform=iOS' \
            DEVELOPMENT_TEAM="$TEAM_ID" \
            PROVISIONING_PROFILE="$PROFILE_UUID" \
            CODE_SIGN_STYLE=Manual \
            CODE_SIGN_IDENTITY="Apple Distribution" \
            PRODUCT_BUNDLE_IDENTIFIER="$BUNDLE_ID" \
            clean archive

      - name: Export IPA
        env:
          TEAM_ID: ${{ steps.profile.outputs.team_id }}
          PROFILE_UUID: ${{ steps.profile.outputs.uuid }}
        run: |
          set -euo pipefail
          cat > "$RUNNER_TEMP/ExportOptions.plist" <<PLIST
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>method</key>
            <string>app-store-connect</string>
            <key>teamID</key>
            <string>$TEAM_ID</string>
            <key>signingStyle</key>
            <string>manual</string>
            <key>provisioningProfiles</key>
            <dict>
              <key>$BUNDLE_ID</key>
              <string>$PROFILE_UUID</string>
            </dict>
          </dict>
          </plist>
          PLIST

          xcodebuild -exportArchive \
            -archivePath "$RUNNER_TEMP/App.xcarchive" \
            -exportOptionsPlist "$RUNNER_TEMP/ExportOptions.plist" \
            -exportPath "$RUNNER_TEMP/export"

      - name: Upload IPA artifact
        uses: actions/upload-artifact@v4
        with:
          name: ios-ipa
          path: ${{ runner.temp }}/export/*.ipa
          retention-days: 14

      - name: Upload to TestFlight
        env:
          APP_STORE_KEY_ID: ${{ secrets.APP_STORE_KEY_ID }}
          APP_STORE_ISSUER_ID: ${{ secrets.APP_STORE_ISSUER_ID }}
          APP_STORE_KEY_BASE64: ${{ secrets.APP_STORE_KEY_BASE64 }}
        run: |
          set -euo pipefail
          mkdir -p ~/.appstoreconnect/private_keys
          echo -n "$APP_STORE_KEY_BASE64" | base64 --decode -o ~/.appstoreconnect/private_keys/AuthKey_${APP_STORE_KEY_ID}.p8

          IPA_PATH=$(find "$RUNNER_TEMP/export" -name "*.ipa" | head -n 1)

          xcrun altool --upload-app \
            --type ios \
            --file "$IPA_PATH" \
            --apiKey "$APP_STORE_KEY_ID" \
            --apiIssuer "$APP_STORE_ISSUER_ID"

      - name: Clean up keychain
        if: always()
        run: security delete-keychain "$RUNNER_TEMP/app-signing.keychain-db" || true
