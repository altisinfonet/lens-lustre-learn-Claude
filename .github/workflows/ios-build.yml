name: iOS Build

# 50mm Retina World — iOS build, sign, and TestFlight upload.
#
# This is the iOS counterpart to android-build.yml. It builds the same React
# web bundle (dist/), wraps it in a fresh Capacitor iOS project, signs it with
# the Distribution Certificate + App Store provisioning profile, and uploads
# the resulting .ipa to TestFlight via the App Store Connect API.
#
# Required secrets (Settings -> Secrets and variables -> Actions):
#   BUILD_CERTIFICATE_BASE64        - distribution.p12, base64-encoded
#   BUILD_CERTIFICATE_PASSWORD      - export password for the .p12
#   BUILD_PROVISION_PROFILE_BASE64  - App Store provisioning profile, base64-encoded
#   APP_STORE_KEY_ID                - App Store Connect API Key ID
#   APP_STORE_ISSUER_ID             - App Store Connect API Issuer ID
#   APP_STORE_KEY_BASE64            - App Store Connect API private key (.p8), base64-encoded
#
# Bundle ID: com.fiftymmretina.app (must match capacitor.config.ts appId and
# the App ID used to generate the provisioning profile).
#
# SCOPE NOTE: this first iOS build wires up the core, iOS-safe plugins only
# (share, filesystem, camera, app, browser). Firebase push
# (@capacitor-firebase/messaging) and Play-style in-app updates
# (@capawesome/capacitor-app-update) are Android-specific setups — push needs
# an APNs key + proper iOS setup, and in-app updates don't work that way on
# iOS at all. Add push as a deliberate follow-up, not by just flipping it on.
# splash-screen is temporarily excluded too - see the note on the plugin
# install step below (it is NOT an upstream incompatibility; it can be
# restored as a follow-up now that the toolchain is fixed).
#
# NODE 22, NOT 20 - matches android-build.yml. @capacitor/cli 8.5.0 requires it.
#
# TOOLCHAIN: this workflow requires a runner with Xcode 26.x (Swift 6.2+).
# See the comment on `runs-on` below before changing the runner image or the
# Xcode version - building on Swift 6.0 cannot work, for a concrete reason.
#
# Trigger: manual only (workflow_dispatch) until a first build is verified
# end-to-end. Once a build lands cleanly in TestFlight, uncomment the `push`
# trigger below to build iOS automatically on every push to main, same as
# Android does.

on:
  workflow_dispatch:
  # push:
  #   branches: [main]

concurrency:
  group: ios-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-ios:
    # macos-15, NOT macos-14. This is a hard requirement, not a preference.
    # Capacitor 8.5.0 ships its iOS runtime as a prebuilt binary xcframework
    # (ionic-team/capacitor-swift-pm) whose .swiftinterface header records
    # "Apple Swift version 6.2". Inside it, every single-argument convenience
    # accessor on CAPPluginCall - getString(_:), getBool(_:), getArray(_:),
    # and reject(_:) with its default parameters - is wrapped in
    # `#if compiler(>=5.3) && $NonescapableTypes`. A `$Feature` conditional in
    # a textual module interface is true only when the *reading* compiler
    # implements that feature. macos-14 images top out at Xcode 16.2 =
    # Swift 6.0, which does not have NonescapableTypes, so those declarations
    # are invisible and every Capacitor plugin that calls them fails to
    # compile. No build flag can fix that - the feature simply isn't in that
    # compiler. macos-15 carries Xcode 26.x (Swift 6.2+), where the gate
    # evaluates true and the API is visible as intended.
    runs-on: macos-15
    timeout-minutes: 60
    env:
      BUNDLE_ID: com.fiftymmretina.app
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Build web bundle
        env:
          VITE_SUPABASE_URL: https://jtdtehuqtinjxropkkcn.supabase.co
          VITE_SUPABASE_PUBLISHABLE_KEY: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Imp0ZHRlaHVxdGluanhyb3Bra2NuIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODM1NzI3MjEsImV4cCI6MjA5OTE0ODcyMX0.qY8BI5LXb6uLzTwbpf8AleZ6UZyfeaOA0q4_TC5CEpo
          VITE_SUPABASE_PROJECT_ID: jtdtehuqtinjxropkkcn
        run: npm run build

      - name: Install Capacitor + iOS-safe native plugins (pinned)
        run: |
          # @capacitor/splash-screen@8.0.2 is still excluded here, but the
          # original reason recorded for it was WRONG and is corrected for the
          # record: it was not a stale plugin that "predates breaking API
          # changes in core 8.5.0". Its failures were the same Swift-version
          # gate described on the runs-on block above. Checked against the
          # real .swiftinterface, every API it touches is either ungated
          # (bridge.viewController, UIColor.capacitor.color(fromHex:) - the
          # argument label never changed, getBoolean, getInt) or gated by
          # $NonescapableTypes and therefore restored by Swift 6.2
          # (CAPPluginCall.reject, PluginConfig.getString). The reported
          # viewController/UIColor errors were knock-on diagnostics from the
          # gated calls failing to type-check earlier in the same file.
          # It stays out of THIS commit only to keep the toolchain fix a
          # single isolated variable - nothing in src/ imports it, so its
          # absence costs only the native splash screen. Re-add it as a
          # follow-up once this pipeline is green; no upstream release is
          # needed. android-build was never affected (separate Kotlin impl).
          npm install --no-audit --no-fund \
            @capacitor/core@8.5.0 @capacitor/cli@8.5.0 @capacitor/ios@8.5.0 \
            @capacitor/share@8.0.1 \
            @capacitor/filesystem@8.1.2 @capacitor/camera@8.2.2 \
            @capacitor/app@8.1.1 @capacitor/browser@8.0.4

      - name: Add iOS platform
        run: npx cap add ios

      - name: Sync web assets into iOS project
        run: npx cap sync ios

      - name: Verify synced assets exist
        id: verify
        run: |
          set -euo pipefail
          PUB="ios/App/App/public"
          test -f "$PUB/index.html" || { echo "::error::No synced web assets at $PUB - cap sync did not run?"; exit 1; }

          # Capacitor 8+ integrates iOS native deps via Swift Package Manager by
          # default (writes Package.swift, no CocoaPods `pod install`), so no
          # CocoaPods-generated App.xcworkspace exists - only App.xcodeproj.
          # Detect whichever container cap sync actually produced so Archive
          # stays correct whether SPM or CocoaPods integration is in use.
          if [ -d "ios/App/App.xcworkspace" ]; then
            echo "container_flag=-workspace" >> "$GITHUB_OUTPUT"
            echo "container_path=ios/App/App.xcworkspace" >> "$GITHUB_OUTPUT"
          elif [ -d "ios/App/App.xcodeproj" ]; then
            echo "container_flag=-project" >> "$GITHUB_OUTPUT"
            echo "container_path=ios/App/App.xcodeproj" >> "$GITHUB_OUTPUT"
          else
            echo "::error::Neither ios/App/App.xcworkspace nor ios/App/App.xcodeproj exists after cap sync"
            exit 1
          fi

      - name: Import Distribution Certificate + Provisioning Profile
        env:
          BUILD_CERTIFICATE_BASE64: ${{ secrets.BUILD_CERTIFICATE_BASE64 }}
          BUILD_CERTIFICATE_PASSWORD: ${{ secrets.BUILD_CERTIFICATE_PASSWORD }}
          BUILD_PROVISION_PROFILE_BASE64: ${{ secrets.BUILD_PROVISION_PROFILE_BASE64 }}
        run: |
          set -euo pipefail
          KEYCHAIN_PATH="$RUNNER_TEMP/app-signing.keychain-db"
          KEYCHAIN_PASSWORD="$(openssl rand -base64 24)"
          CERT_PATH="$RUNNER_TEMP/distribution.p12"
          PROFILE_PATH="$RUNNER_TEMP/profile.mobileprovision"

          echo -n "$BUILD_CERTIFICATE_BASE64" | base64 --decode -o "$CERT_PATH"
          echo -n "$BUILD_PROVISION_PROFILE_BASE64" | base64 --decode -o "$PROFILE_PATH"

          echo "DEBUG: cert file size=$(wc -c < "$CERT_PATH") sha256=$(shasum -a 256 "$CERT_PATH" | awk '{print $1}')"
          echo "DEBUG: profile file size=$(wc -c < "$PROFILE_PATH") sha256=$(shasum -a 256 "$PROFILE_PATH" | awk '{print $1}')"
          echo "DEBUG: password length=${#BUILD_CERTIFICATE_PASSWORD}"
          echo "DEBUG: base64 secret length=${#BUILD_CERTIFICATE_BASE64}"

          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"

          security import "$CERT_PATH" -P "$BUILD_CERTIFICATE_PASSWORD" -A \
            -t cert -f pkcs12 -k "$KEYCHAIN_PATH"
          security set-key-partition-list -S apple-tool:,apple: -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security list-keychain -d user -s "$KEYCHAIN_PATH" $(security list-keychains -d user | sed 's/"//g')

          mkdir -p ~/Library/MobileDevice/Provisioning\ Profiles
          cp "$PROFILE_PATH" ~/Library/MobileDevice/Provisioning\ Profiles/profile.mobileprovision

      - name: Read provisioning profile UUID and Team ID
        id: profile
        run: |
          set -euo pipefail
          PROFILE="$RUNNER_TEMP/profile.mobileprovision"
          UUID=$(security cms -D -i "$PROFILE" | plutil -extract UUID xml1 -o - - | sed -n 's/.*<string>\(.*\)<\/string>.*/\1/p')
          TEAM_ID=$(security cms -D -i "$PROFILE" | plutil -extract TeamIdentifier.0 xml1 -o - - | sed -n 's/.*<string>\(.*\)<\/string>.*/\1/p')
          echo "uuid=$UUID" >> "$GITHUB_OUTPUT"
          echo "team_id=$TEAM_ID" >> "$GITHUB_OUTPUT"

      - name: Set up Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          # Pinned to a 26.x release, not `latest-stable`. Swift 6.2 or newer
          # is required to see Capacitor's $NonescapableTypes-gated API (see
          # the note on runs-on above); Xcode 26.x is the first line that
          # provides it. `latest-stable` is what silently selected Xcode 16.2
          # on the old macos-14 runner and caused the compile failures.
          xcode-version: '26.3'

      - name: Prepare App Store Connect API key
        id: asckey
        env:
          APP_STORE_KEY_ID: ${{ secrets.APP_STORE_KEY_ID }}
          APP_STORE_KEY_BASE64: ${{ secrets.APP_STORE_KEY_BASE64 }}
        run: |
          set -euo pipefail
          # One key file, used by three consumers: xcodebuild archive,
          # xcodebuild -exportArchive (both via -authenticationKey*), and
          # altool (which insists on ~/.appstoreconnect/private_keys).
          KEYDIR="$RUNNER_TEMP/private_keys"
          mkdir -p "$KEYDIR" ~/.appstoreconnect/private_keys
          KEYPATH="$KEYDIR/AuthKey_${APP_STORE_KEY_ID}.p8"
          echo -n "$APP_STORE_KEY_BASE64" | base64 --decode -o "$KEYPATH"
          cp "$KEYPATH" ~/.appstoreconnect/private_keys/
          echo "key_path=$KEYPATH" >> "$GITHUB_OUTPUT"

      - name: Archive
        env:
          CONTAINER_FLAG: ${{ steps.verify.outputs.container_flag }}
          CONTAINER_PATH: ${{ steps.verify.outputs.container_path }}
          TEAM_ID: ${{ steps.profile.outputs.team_id }}
          KEY_PATH: ${{ steps.asckey.outputs.key_path }}
          APP_STORE_KEY_ID: ${{ secrets.APP_STORE_KEY_ID }}
          APP_STORE_ISSUER_ID: ${{ secrets.APP_STORE_ISSUER_ID }}
        run: |
          set -euo pipefail

          # SIGNING MODEL - read this before changing any flag here.
          #
          # Capacitor 8's SPM integration puts each plugin in the build graph
          # as its own target, and two of them (IONCameraLib, IONFilesystemLib)
          # end up as embedded dynamic *frameworks* inside the .app. That
          # creates two traps, and this workflow has now hit both:
          #
          # 1. Forcing PROVISIONING_PROFILE / PROVISIONING_PROFILE_SPECIFIER as
          #    a global CLI override applies it to every target. Frameworks and
          #    SPM library targets cannot carry a provisioning profile, so the
          #    build dies with "does not support provisioning profiles".
          #
          # 2. Reacting to (1) by archiving with CODE_SIGNING_ALLOWED=NO leaves
          #    those embedded frameworks UNSIGNED in the archive. -exportArchive
          #    must then sign them, and under signingStyle: manual it resolves a
          #    profile per bundle - including the frameworks - so it fails with
          #    the exact same message, just one step later. That is what build
          #    #13 hit, after ARCHIVE SUCCEEDED.
          #
          # The way out is not another override: it is to let Xcode sign
          # normally, with automatic signing driven by the App Store Connect
          # API key. Xcode then gives the App target a real profile and signs
          # the embedded frameworks with the identity alone - frameworks never
          # get profiles, which is precisely the rule both failures were
          # violating. DEVELOPMENT_TEAM and CODE_SIGN_STYLE are safe as global
          # overrides (every target accepts them); PROVISIONING_PROFILE* is
          # not, and is deliberately absent.
          xcodebuild "$CONTAINER_FLAG" "$CONTAINER_PATH" \
            -scheme App \
            -configuration Release \
            -archivePath "$RUNNER_TEMP/App.xcarchive" \
            -destination 'generic/platform=iOS' \
            -allowProvisioningUpdates \
            -authenticationKeyPath "$KEY_PATH" \
            -authenticationKeyID "$APP_STORE_KEY_ID" \
            -authenticationKeyIssuerID "$APP_STORE_ISSUER_ID" \
            CODE_SIGN_STYLE=Automatic \
            DEVELOPMENT_TEAM="$TEAM_ID" \
            PRODUCT_BUNDLE_IDENTIFIER="$BUNDLE_ID" \
            clean archive

      - name: Export IPA
        env:
          TEAM_ID: ${{ steps.profile.outputs.team_id }}
          KEY_PATH: ${{ steps.asckey.outputs.key_path }}
          APP_STORE_KEY_ID: ${{ secrets.APP_STORE_KEY_ID }}
          APP_STORE_ISSUER_ID: ${{ secrets.APP_STORE_ISSUER_ID }}
        run: |
          set -euo pipefail
          # signingStyle: automatic to match the archive, and NO
          # provisioningProfiles dict. Under manual style Xcode looks up a
          # profile for every bundle it signs, including the embedded
          # IONCameraLib/IONFilesystemLib frameworks, which cannot have one -
          # that is the "does not support provisioning profiles" export
          # failure. Automatic style signs frameworks with the identity only
          # and reserves profiles for the app bundle, which is the correct
          # model for an app with embedded frameworks.
          cat > "$RUNNER_TEMP/ExportOptions.plist" <<PLIST
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>method</key>
            <string>app-store-connect</string>
            <key>teamID</key>
            <string>$TEAM_ID</string>
            <key>signingStyle</key>
            <string>automatic</string>
            <key>uploadSymbols</key>
            <true/>
          </dict>
          </plist>
          PLIST

          xcodebuild -exportArchive \
            -archivePath "$RUNNER_TEMP/App.xcarchive" \
            -exportOptionsPlist "$RUNNER_TEMP/ExportOptions.plist" \
            -exportPath "$RUNNER_TEMP/export" \
            -allowProvisioningUpdates \
            -authenticationKeyPath "$KEY_PATH" \
            -authenticationKeyID "$APP_STORE_KEY_ID" \
            -authenticationKeyIssuerID "$APP_STORE_ISSUER_ID"

      - name: Upload IPA artifact
        uses: actions/upload-artifact@v4
        with:
          name: ios-ipa
          path: ${{ runner.temp }}/export/*.ipa
          retention-days: 14

      - name: Upload to TestFlight
        env:
          APP_STORE_KEY_ID: ${{ secrets.APP_STORE_KEY_ID }}
          APP_STORE_ISSUER_ID: ${{ secrets.APP_STORE_ISSUER_ID }}
          APP_STORE_KEY_BASE64: ${{ secrets.APP_STORE_KEY_BASE64 }}
        run: |
          set -euo pipefail
          # The key was already written by "Prepare App Store Connect API key"
          # into ~/.appstoreconnect/private_keys, which is where altool looks.

          IPA_PATH=$(find "$RUNNER_TEMP/export" -name "*.ipa" | head -n 1)
          test -n "$IPA_PATH" || { echo "::error::No .ipa produced by Export IPA"; exit 1; }
          echo "Uploading: $IPA_PATH"

          xcrun altool --upload-app \
            --type ios \
            --file "$IPA_PATH" \
            --apiKey "$APP_STORE_KEY_ID" \
            --apiIssuer "$APP_STORE_ISSUER_ID"

      - name: Clean up keychain
        if: always()
        run: security delete-keychain "$RUNNER_TEMP/app-signing.keychain-db" || true
