# A push to this throwaway tool branch is the manual act that runs it.
# workflow_dispatch is unusable here: GitHub registers dispatchable workflows
# only from the DEFAULT branch, and this file must never reach main.
#
# SUPABASE_DB_URL is the only credential secret that exists (proven: run
# 32553680478 rendered it as ***, while SUPABASE_DB_PASSWORD rendered empty in
# runs 32554555368 attempts 1 and 2). Whatever shape it holds is normalised in
# the runner rather than guessed at from outside.
name: Schema dump (tool branch, artifact only)
on:
  push:
    branches: [staging/schema-dump-tool]
jobs:
  dump:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: supabase/setup-cli@v1
        with: { version: latest }

      - name: Normalise whatever SUPABASE_DB_URL contains into a valid URI
        env:
          RAW: ${{ secrets.SUPABASE_DB_URL }}
        run: |
          test -n "$RAW" || { echo "::error::SUPABASE_DB_URL is empty"; exit 1; }
          OUT=$(python3 - <<'PY'
          import os, urllib.parse
          HOST = "aws-1-ap-northeast-2.pooler.supabase.com"
          PORT = "5432"
          USER = "postgres.jtdtehuqtinjxropkkcn"   # production, hardcoded on purpose
          DB   = "postgres"

          raw = os.environ["RAW"]
          raw = raw.replace("\r", "").replace("\n", "").strip()
          # strip one layer of surrounding quotes if present
          for q in ('"', "'"):
              if len(raw) >= 2 and raw.startswith(q) and raw.endswith(q):
                  raw = raw[1:-1].strip()

          mode = ""
          pw = ""
          if raw.startswith("postgresql://") or raw.startswith("postgres://"):
              body = raw.split("://", 1)[1]
              mode = "uri"
          elif "@" in raw and "pooler" in raw:
              body = raw
              mode = "uri-missing-scheme"
          else:
              body = None
              mode = "raw-password"

          if body is None:
              pw = raw
          else:
              creds, _host = body.rsplit("@", 1)       # last @ separates creds from host
              if ":" in creds:
                  _user, pw = creds.split(":", 1)      # first : after user separates password
              else:
                  _user, pw = creds, ""
              # if the password looks already percent-encoded, decode once so we don't double-encode
              if "%" in pw:
                  try:
                      dec = urllib.parse.unquote(pw)
                      if urllib.parse.quote(dec, safe="") == pw:
                          pw = dec
                  except Exception:
                      pass

          if not pw:
              print("DIAG|empty-password|0|" + mode)
              raise SystemExit(3)

          enc = urllib.parse.quote(pw, safe="")
          url = f"postgresql://{USER}:{enc}@{HOST}:{PORT}/{DB}"
          print("DIAG|" + mode + "|" + str(len(pw)) + "|" + ("specials" if enc != pw else "plain"))
          print("URL|" + url)
          PY
          ) || { echo "::error::normaliser failed (empty or unusable password)"; echo "$OUT"; exit 1; }
          DIAG=$(printf '%s\n' "$OUT" | grep '^DIAG|')
          DB_URL=$(printf '%s\n' "$OUT" | grep '^URL|' | cut -d'|' -f2-)
          echo "::add-mask::$DB_URL"
          echo "diagnostics (no secret content): $DIAG"
          echo "DB_URL=$DB_URL" >> "$GITHUB_ENV"
          echo "normalised OK -> postgresql://postgres.jtdtehuqtinjxropkkcn:<masked>@aws-1-ap-northeast-2.pooler.supabase.com:5432/postgres"

      - name: Dump production schema (NO DATA)
        run: |
          supabase db dump --db-url "$DB_URL" -f prod_public_schema.sql

      - name: GUARD + VALIDATION COUNTS
        run: |
          set -euo pipefail
          if grep -qiE '^(COPY [^ ]+ .*FROM stdin|INSERT INTO )' prod_public_schema.sql; then
            echo "::error::dump contains row data — refusing"; exit 1; fi

          SHA=$(sha256sum prod_public_schema.sql | cut -d' ' -f1)
          PINNED=e675ca950d8b4a771e8baf1f8356b82e8db10139b95f59aacab9de5bb390e946
          if [ "$SHA" = "$PINNED" ]; then
            echo "::notice::BYTE-IDENTICAL to run-4 artifact — counts below describe that exact file"
          else
            echo "::warning::sha256 differs from run 4 ($SHA). Either production schema changed or the CLI version moved. Do NOT proceed to apply until explained."
          fi

          # Supabase CLI rewrites 'CREATE TRIGGER "' -> 'CREATE OR REPLACE TRIGGER "'.
          # Anchoring on '^CREATE TRIGGER' can never match. This is the corrected counter.
          grep -E '^CREATE (OR REPLACE )?TRIGGER ' prod_public_schema.sql \
            | sed -E 's/^CREATE (OR REPLACE )?TRIGGER "([^"]+)".* ON "public"\."([^"]+)".*/\2|\3/' \
            | LC_ALL=C sort > /tmp/tg_pairs.txt
          TG_COUNT=$(wc -l < /tmp/tg_pairs.txt)
          TG_DIGEST=$(printf '%s' "$(cat /tmp/tg_pairs.txt)" | md5sum | cut -d' ' -f1)
          CONSTRAINT_TG=$(grep -cE '^CREATE CONSTRAINT TRIGGER ' prod_public_schema.sql || true)

          echo "=== VALIDATION COUNTS (corrected) ==="
          echo "bytes:          $(wc -c < prod_public_schema.sql)"
          echo "sha256:         $SHA"
          echo "CREATE TABLE:   $(grep -c '^CREATE TABLE' prod_public_schema.sql)"
          echo "FUNCTIONS:      $(grep -cE '^CREATE (OR REPLACE )?FUNCTION' prod_public_schema.sql)"
          echo "POLICIES:       $(grep -c '^CREATE POLICY' prod_public_schema.sql)"
          echo "INDEXES:        $(grep -cE '^CREATE (UNIQUE )?INDEX' prod_public_schema.sql)"
          echo "TRIGGERS:       $TG_COUNT            # expect 148"
          echo "TRIGGER DIGEST: $TG_DIGEST   # expect d289eafea3cb2c73094a2bd1c3d338fd"
          echo "CONSTRAINT TRG: $CONSTRAINT_TG            # expect 0"
          echo "VIEWS:          $(grep -cE '^CREATE (OR REPLACE )?VIEW' prod_public_schema.sql)"
          echo "SEQUENCES:      $(grep -c '^CREATE SEQUENCE' prod_public_schema.sql)"
          echo "EXTENSIONS:     $(grep -c '^CREATE EXTENSION' prod_public_schema.sql)"
          echo "RLS ENABLE:     $(grep -c 'ENABLE ROW LEVEL SECURITY' prod_public_schema.sql)"
          echo "ALTER TABLE:    $(grep -c '^ALTER TABLE' prod_public_schema.sql)"
          echo "GRANTS:         $(grep -c '^GRANT ' prod_public_schema.sql)"

          FAIL=0
          [ "$TG_COUNT" = "148" ] || { echo "::error::TRIGGERS $TG_COUNT != 148"; FAIL=1; }
          [ "$TG_DIGEST" = "d289eafea3cb2c73094a2bd1c3d338fd" ] || { echo "::error::trigger set digest mismatch"; FAIL=1; }
          [ "$CONSTRAINT_TG" = "0" ] || { echo "::error::unexpected CREATE CONSTRAINT TRIGGER lines"; FAIL=1; }
          exit $FAIL

      # Runs only when the guard above passed - no `if: always()`. Neither
      # sandbox can download the artifact (blob.core.windows.net is blocked in
      # both), so the file has to exist as a git object to be reachable at all.
      # Nothing new is disclosed: the repository is public and the same schema
      # already sits in 629 committed migrations.
      - name: Publish the validated dump to this branch
        run: |
          set -euo pipefail
          SHA=$(sha256sum prod_public_schema.sql | cut -d' ' -f1)
          PINNED=e675ca950d8b4a771e8baf1f8356b82e8db10139b95f59aacab9de5bb390e946
          if [ "$SHA" != "$PINNED" ]; then
            echo "::error::refusing to publish: sha256 $SHA != pinned $PINNED"; exit 1; fi
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -f prod_public_schema.sql
          git commit -m "chore(schema-dump): publish the validated production schema dump (sha256 ${SHA})"
          git push origin HEAD:staging/schema-dump-tool
          echo "::notice::published commit $(git rev-parse HEAD)"

      - uses: actions/upload-artifact@v4
        with:
          name: prod-schema
          path: prod_public_schema.sql
          retention-days: 5
