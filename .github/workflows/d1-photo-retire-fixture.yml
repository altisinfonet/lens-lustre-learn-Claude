name: D1 · photo retire, competition full size (U6) — lane-shaped fixture

# ═══════════════════════════════════════════════════════════════════════════
# CONNECTS TO NOTHING BUT A THROWAWAY postgres:17.6 SERVICE CONTAINER.
# HOLDS NO SECRET: the container password below is a literal placeholder for a
# database that exists for the length of this job.
#
# WHAT IT PROVES (20261110_0103). scripts/db-photo-retire-fixture.mjs runs the
# REAL migration, PROBE and ROLLBACK over supabase/tests/photo-retire/ in a
# production shape and a staging shape: fail-first; every refusal; exactly
# which entry photos are due ("results final" = round 4 published, + 30 days,
# v2 photos only); nothing changes while the switch is off; the swap to the
# 2048 copy; a file still named elsewhere is kept; the deleter's claim window;
# the rollback restores exactly and refuses once a file is deleted.
# ═══════════════════════════════════════════════════════════════════════════

on:
  pull_request:
    paths:
      - 'supabase/migrations/20261110_0103_photo_retire.sql'
      - 'supabase/migrations/PROBE_20261110_0103_photo_retire.sql'
      - 'supabase/rollback/20261110_0103_photo_retire_ROLLBACK.sql'
      - 'supabase/tests/photo-retire/**'
      - 'scripts/db-photo-retire-fixture.mjs'
      - '.github/workflows/d1-photo-retire-fixture.yml'

permissions:
  contents: read

jobs:
  fixture:
    name: photo retire on lane-shaped databases
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:17.6
        env:
          POSTGRES_PASSWORD: fixture-not-a-secret
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    env:
      PGHOST: 127.0.0.1
      PGPORT: '5432'
      PGUSER: postgres
      PGPASSWORD: fixture-not-a-secret
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install psql
        run: sudo apt-get update -qq && sudo apt-get install -y -qq postgresql-client

      - name: The throwaway server
        run: psql -X -d postgres -tAc 'select version()'

      - name: Fixture — fail-first, apply, PROBE, mark, keep, claim, rollback, delete record (both shapes)
        run: node scripts/db-photo-retire-fixture.mjs
