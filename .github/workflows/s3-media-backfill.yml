name: S3 media derivatives backfill (manual, lane-guarded)

# ═══════════════════════════════════════════════════════════════════════════
# S3-e — runs tools/media-derivatives/run.mjs (600 / 1080 / 1440 WebP for every
# ready photo) from GitHub, so the backfill needs no laptop and no VM.
# MANUAL DISPATCH ONLY. Nothing here runs on push or on a schedule.
#
# WHO IT RUNS AS: the converter account (20261013_0007 — banned, hidden, holds
# no role; media_derivative_worker_ok() accepts it). It signs in with the
# public anon key and that account's e-mail + password, which live ONLY in the
# lane's GitHub Environment secrets MEDIA_WORKER_EMAIL / MEDIA_WORKER_PASSWORD.
# The access token is masked, written to a 0600 file and never printed; it
# expires after one hour (the job stops at 55 minutes; the run is resumable).
#
# SAFETY comes from the tool and the server, unchanged: resumable, idempotent,
# never overwrites, never deletes, never writes an original; --dry-run reads
# the queue only. Nothing a member sees changes while media_ladder_feed is off.
#
# FENCES:
#   1. target=production must run from the main BRANCH, staging from the
#      staging branch (github.ref, so a tag named main does not pass).
#   2. The site, Supabase URL and anon key come from the target choice, never typed.
#   3. Refuses to start without both secrets.
#
# ONE-TIME SETUP (Owner only): GitHub → Settings → Environments → staging (and
# production) → Add environment secret: MEDIA_WORKER_EMAIL = the converter
# account's e-mail, MEDIA_WORKER_PASSWORD = its password (the same two values
# the converter VM holds).
#
# RULE kept from apply-migration.yml: no ${{ inside any run: block — every
# input is bound once, in env:.
# ═══════════════════════════════════════════════════════════════════════════

on:
  workflow_dispatch:
    inputs:
      target:
        description: "staging = fpszggreishhuvdpkmdr, production = jtdtehuqtinjxropkkcn"
        required: true
        type: choice
        options: [staging, production]
      mode:
        description: "dry-run (reads the queue only) or run"
        required: true
        type: choice
        options: [dry-run, run]
      max:
        description: "stop after this many media (0 = no limit)"
        required: false
        type: string
        default: "0"
      job:
        description: "ladder = S3 600/1080/1440 for media posts · photo-set = photo plan U5, the v2 set (credited 2048/1080/600/320) beside every old post photo · rectify-l4 = the -l4 posts get a -l5 set from their clean 1080 (small credit), recorded for 20261110_0107 · redraw-credit = the rectified photos' credited copy redrawn with the current credit geometry (20261110_0108) · old-credit = every old (unmarked) post photo gets a credited copy (v4) at a new derived key, found by the web through post_photo_credit_for (20261110_0109)"
        required: false
        type: choice
        options: [ladder, photo-set, rectify-l4, redraw-credit, old-credit]
        default: ladder

concurrency:
  group: s3-media-backfill-${{ inputs.target }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  backfill:
    name: ${{ inputs.mode }} ${{ inputs.job || 'ladder' }} backfill on ${{ inputs.target }}
    runs-on: ubuntu-latest
    timeout-minutes: 55
    environment: ${{ inputs.target }}
    env:
      TARGET_LANE: ${{ inputs.target }}
      BRANCH_REF: ${{ github.ref }}
      MODE: ${{ inputs.mode }}
      MAX_IN: ${{ inputs.max }}
      JOB: ${{ inputs.job }}
      # The worker e-mail / password are bound ONLY on the two steps that need
      # them, never job-wide: npm install scripts and the tool never see them.
    steps:
      - name: The branch must match the target, and the lane is fixed by it
        run: |
          set -euo pipefail
          case "$TARGET_LANE" in
            production) WANT=refs/heads/main;    SITE=https://www.50mmretina.com;     SB=https://jtdtehuqtinjxropkkcn.supabase.co
                        ANON=eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Imp0ZHRlaHVxdGluanhyb3Bra2NuIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODM1NzI3MjEsImV4cCI6MjA5OTE0ODcyMX0.qY8BI5LXb6uLzTwbpf8AleZ6UZyfeaOA0q4_TC5CEpo ;;
            staging)    WANT=refs/heads/staging; SITE=https://staging.50mmretina.com; SB=https://fpszggreishhuvdpkmdr.supabase.co
                        ANON=eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImZwc3pnZ3JlaXNoaHV2ZHBrbWRyIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODkxMDcyNDUsImV4cCI6MjEwNDY4MzI0NX0.h3t2eZ8hwXDev6JydjsDnA8CpXFlKve4CaUlXp_mwiQ ;;
            *) echo "::error::Unknown target '$TARGET_LANE'."; exit 1 ;;
          esac
          if [ "$BRANCH_REF" != "$WANT" ]; then
            echo "::error::target='$TARGET_LANE' must be dispatched from '$WANT', not '$BRANCH_REF'. Refusing."
            exit 1
          fi
          case "$MODE" in dry-run|run) ;; *) echo "::error::mode must be dry-run or run"; exit 1 ;; esac
          case "$MAX_IN" in ''|*[!0-9]*) echo "::error::max must be a whole number"; exit 1 ;; esac
          { echo "SITE=$SITE"; echo "SB_URL=$SB"; echo "SB_ANON=$ANON"; } >> "$GITHUB_ENV"
          echo "Lane OK: $TARGET_LANE ($SITE) from $BRANCH_REF."

      - name: Refuse to start without the worker account
        env:
          WORKER_EMAIL: ${{ secrets.MEDIA_WORKER_EMAIL }}
          WORKER_PASSWORD: ${{ secrets.MEDIA_WORKER_PASSWORD }}
        run: |
          if [ -z "$WORKER_EMAIL" ] || [ -z "$WORKER_PASSWORD" ]; then
            echo "::error::MEDIA_WORKER_EMAIL / MEDIA_WORKER_PASSWORD are not set on the '$TARGET_LANE' environment (Owner setup, see header)."
            exit 1
          fi
          echo "Worker account secrets present. Their values are never printed."

      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install (lockfile only)
        run: npm ci --no-audit --no-fund

      - name: Sign in as the worker account (token masked, 0600 file)
        env:
          WORKER_EMAIL: ${{ secrets.MEDIA_WORKER_EMAIL }}
          WORKER_PASSWORD: ${{ secrets.MEDIA_WORKER_PASSWORD }}
          # Only for production's CAPTCHA-protected password grant (worker-session.mjs header).
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: |
          set -euo pipefail
          umask 077
          # Secrets are read from the environment by the tool, never from a command line;
          # it masks the token before writing it (0600) and prints it nowhere. It never signs
          # other sessions out (the live video converter uses the same account).
          node tools/media-derivatives/worker-session.mjs --out "$RUNNER_TEMP/worker.jwt"
          [ -s "$RUNNER_TEMP/worker.jwt" ] || { echo "::error::the sign-in tool wrote no token"; exit 1; }
          echo "MEDIA_WORKER_JWT_FILE=$RUNNER_TEMP/worker.jwt" >> "$GITHUB_ENV"

      - name: Run the backfill tool
        run: |
          set -euo pipefail
          ARGS=(--site "$SITE" --max "$MAX_IN")
          [ "$MODE" = "dry-run" ] && ARGS+=(--dry-run)
          case "${JOB:-ladder}" in
            ladder)    TOOL=tools/media-derivatives/run.mjs ;;
            photo-set) TOOL=tools/media-derivatives/photo-set.mjs ;;
            rectify-l4) TOOL=tools/media-derivatives/rectify-l4.mjs ;;
            redraw-credit) TOOL=tools/media-derivatives/rectify-l4.mjs; ARGS+=(--redraw) ;;
            old-credit) TOOL=tools/media-derivatives/old-credit.mjs ;;
            *) echo "::error::job must be ladder, photo-set, rectify-l4, redraw-credit or old-credit"; exit 1 ;;
          esac
          node "$TOOL" "${ARGS[@]}"

      - name: Forget the token
        if: always()
        run: rm -f "$RUNNER_TEMP/worker.jwt" "$RUNNER_TEMP/auth.json"
