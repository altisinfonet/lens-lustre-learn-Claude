name: D2 · App origin journey

# The Android app is a Capacitor shell whose pages run on https://localhost and
# call the site for every route in src/lib/net/siteApi.ts. Two halves:
#   1. THIS CHECKOUT's own Pages Functions, in-process (src/__tests__/
#      appOriginJourney.test.ts) — what makes a PR that breaks the app origin
#      fail before it is deployed.
#   2. The STAGING site, over the wire (scripts/app-origin-check.mjs) — what is
#      actually deployed. During a PR it reads staging as it is before the merge.
#   3. S4-c · THE NAVIGATION JOURNEYS AT https://localhost — the L1/S4 nav
#      harness (real Feed, PostDetail, bell, Notifications page; the Android
#      stub for push taps and Back) served AT the app's origin, so Back per
#      entry is proven where the app actually runs, not only on 127.0.0.1.
# Reads only public staging URLs. Holds no secret. Prints statuses and header
# values only.
#
# ⚠ NO `${{ ... }}` MAY APPEAR INSIDE ANY `run:` BLOCK — F-47's bright line.

on:
  pull_request:
    branches: [main, staging]
  push:
    branches: [main, staging]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  app-origin:
    name: App origin journey (https://localhost)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: npm
      - run: npm ci --no-audit --no-fund
      - name: This checkout's functions answer https://localhost (every SITE_API route)
        run: npx vitest run src/__tests__/appOriginJourney.test.ts
      - name: Install Chromium for Playwright (with its system libraries)
        run: |
          set -uo pipefail
          for attempt in 1 2 3; do
            if npx playwright install --with-deps chromium; then exit 0; fi
            sleep $((attempt * 15))
          done
          exit 1
      - name: Navigation journeys at the app's origin (https://localhost)
        env:
          VITE_SUPABASE_URL: https://testprojectref0000x.supabase.co
          VITE_SUPABASE_PUBLISHABLE_KEY: test-publishable-key-not-real
          VITE_SUPABASE_PROJECT_ID: testprojectref0000x
        run: node tools/uishot/nav-harness.mjs --browser chromium --origin https://localhost --json /tmp/app-origin-nav.json
      - name: Upload the reading
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: app-origin-nav
          path: /tmp/app-origin-nav.json
          if-no-files-found: warn
      - name: The staging site answers https://localhost (every SITE_API route of the build it serves)
        run: node scripts/app-origin-check.mjs https://staging.50mmretina.com
